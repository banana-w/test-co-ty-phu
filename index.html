<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E6ECE8">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cờ Tỷ Phú</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<meta name="apple-mobile-web-app-title" content="Cờ Tỷ Phú">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: the board is the hero (square, left); a ledger of players, title deed and log sits right, stacking under the board on phones */
:root{
  --bg:#E6ECE8; --surface:#F8FBF9; --ink:#17201C; --muted:#56655F; --line:#C8D3CE;
  --accent:#B3261E; --accent-ink:#FFF7F3; --danger:#B42318;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201D; --ink:#E3EBE7; --muted:#93A39D; --line:#2B3733;
  --accent:#E8594D; --accent-ink:#1C0705; --danger:#F97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201D; --ink:#E3EBE7; --muted:#93A39D; --line:#2B3733;
  --accent:#E8594D; --accent-ink:#1C0705; --danger:#F97066; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 26px/1 var(--f-display);letter-spacing:-.01em}
.brand .die{width:28px}
.top nav{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{font:600 14px/1.1 var(--f-body);padding:.66em 1.1em;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .08s ease,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{font-size:13px;padding:.5em .8em}
.btn.xl{font:800 22px/1 var(--f-display);padding:.6em 1.6em;border-radius:12px}

/* ---------- game layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 36px;align-items:start}
.board-wrap{width:min(100%,max(540px,calc(100dvh - 92px)));min-width:0;justify-self:center}
@media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}.board-wrap{width:100%;max-width:680px}.side{max-width:680px;width:100%;justify-self:center}}

.board{aspect-ratio:1;width:100%;container-type:inline-size;display:grid;
  grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  gap:1px;background:var(--b-line);border:2px solid var(--b-line);border-radius:8px;overflow:hidden;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.08)}
.tile{background:var(--b-bg);color:var(--b-ink);position:relative;display:flex;min-width:0;min-height:0;overflow:hidden;cursor:pointer;transition:filter .15s}
.tile:hover{filter:brightness(1.05) saturate(1.05)}
.tile.sel{box-shadow:inset 0 0 0 max(2px,.35cqi) var(--b-accent)}
.side-b{flex-direction:column}.side-t{flex-direction:column-reverse}
.side-l{flex-direction:row-reverse}.side-r{flex-direction:row}
.band{flex:0 0 22%;display:flex;align-items:center;justify-content:center}
.houses{display:flex;gap:.2cqi;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.side-l .houses,.side-r .houses{flex-direction:column;align-items:center}
.house{display:block;width:1.6cqi;height:1.8cqi;min-width:6px;min-height:7px;
  background:linear-gradient(#17683A 0 42%,#3BBE71 42%);clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%)}
.hotel{display:block;width:4.6cqi;height:2.3cqi;min-width:16px;min-height:8px;
  background:repeating-linear-gradient(90deg,transparent 0 12%,#FFE39A 12% 22%) 0 70%/100% 26% no-repeat,linear-gradient(#8E1B14 0 32%,#DE3B2F 32%);
  clip-path:polygon(0 32%,50% 0,100% 32%,100% 100%,0 100%)}
.side-l .hotel,.side-r .hotel{width:2.4cqi;height:3.8cqi;min-width:9px;min-height:14px}
.house.drop,.hotel.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-320%) scale(.5);opacity:0}45%{opacity:1}100%{transform:none}}
.tile.thud{animation:thud .5s ease-out}
@keyframes thud{25%{filter:brightness(1.25)}}
.tile.can-build{box-shadow:inset 0 0 0 max(2px,.4cqi) #F5C542;animation:glow 1.2s ease-in-out infinite;z-index:1}
@keyframes glow{50%{box-shadow:inset 0 0 0 max(3px,.6cqi) #F5C542,inset 0 0 2.4cqi rgba(245,197,66,.55)}}
.tile.dim{filter:saturate(.3) brightness(.9);opacity:.75}
.bb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;white-space:nowrap;pointer-events:none;
  font:800 max(9px,1.3cqi)/1 var(--f-display);background:#F5C542;color:#3A2600;padding:.35cqi .55cqi;border-radius:.6cqi;box-shadow:0 2px 0 #B7861A}
.tprice.rent{opacity:1;background:var(--oc);color:var(--oi);font-weight:700;border-radius:.45cqi;padding:.1cqi .45cqi}
.tprice.mortl{font-style:italic}
.tile.bought .own{animation:ownIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes ownIn{from{transform:scale(0)}}
.tinfo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.3cqi;padding:.55cqi .35cqi;text-align:center;min-width:0;min-height:0}
.tname{font-size:1.25cqi;line-height:1.08;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.tprice{font-size:1.15cqi;font-variant-numeric:tabular-nums;opacity:.78;white-space:nowrap}
.ticon{display:block;width:3.2cqi;height:3.2cqi;color:var(--b-accent)}
.ticon svg{width:100%;height:100%;fill:currentColor;display:block}
.side-l .ticon,.side-r .ticon{width:2.5cqi;height:2.5cqi}
.t-station .ticon,.t-util .ticon{color:var(--b-ink)}
.own{position:absolute;background:transparent}
.side-b .own{left:0;right:0;bottom:0;height:.75cqi}
.side-t .own{left:0;right:0;top:0;height:.75cqi}
.side-l .own{top:0;bottom:0;left:0;width:.75cqi}
.side-r .own{top:0;bottom:0;right:0;width:.75cqi}
.tile.mort .tinfo,.tile.mort .band{opacity:.4}
.tile.mort::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 .8cqi,color-mix(in srgb,var(--b-ink) 14%,transparent) .8cqi 1.05cqi)}
.corner{flex-direction:column;align-items:center;justify-content:center;gap:.4cqi;text-align:center;padding:.8cqi}
.corner .ticon{width:4.6cqi;height:4.6cqi}
.corner .cl{font:800 1.75cqi/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.corner .cs{font-size:1.15cqi;opacity:.75}
.c-jail .ticon svg,.c-park .ticon svg{fill:none;stroke:currentColor;stroke-width:2}
.corner .toks{align-content:flex-start;justify-content:flex-start}
.toks{position:absolute;inset:0;overflow:visible;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:1px;pointer-events:none;padding:2px}
@container (max-width:560px){
  .tname,.corner .cs{display:none}
  .tinfo{justify-content:center}
  .tprice{font-size:max(7px,1.5cqi)}
  .corner .cl{font-size:max(7px,1.9cqi)}
}

/* tokens */
.tok{--sz:max(15px,3.2cqi);width:var(--sz);height:var(--sz);border-radius:50%;background:var(--pc);display:inline-grid;place-items:center;
  font-size:calc(var(--sz)*.6);line-height:1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);flex:none;position:relative}
.toks .tok.cur{--sz:max(24px,5cqi);z-index:2;animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 3px #F5C542,0 0 12px 3px rgba(245,197,66,.8),0 3px 8px rgba(0,0,0,.5)}
.toks .tok.jailed{border-style:dashed;filter:saturate(.6)}
@keyframes bob{50%{transform:translateY(-16%)}}

/* center of board */
.center{grid-row:2/11;grid-column:2/11;background:var(--b-center);color:var(--b-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:max(6px,1.5cqi);padding:max(8px,2.2cqi);text-align:center;position:relative;overflow:hidden;min-width:0;min-height:0}
.c-title{display:grid;gap:.4cqi;justify-items:center}
.c-kicker{font:700 max(9px,1.2cqi)/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;opacity:.65}
.c-name{font:800 max(22px,6cqi)/.92 var(--f-display);color:var(--b-accent);letter-spacing:-.01em;text-wrap:balance}
.c-turn{display:flex;align-items:center;gap:max(8px,1.2cqi);background:var(--b-bg);padding:max(4px,.7cqi) max(12px,1.8cqi) max(4px,.7cqi) max(4px,.7cqi);border-radius:999px;border:1px solid var(--b-line)}
.c-turn .tok{--sz:max(28px,4.4cqi)}
.c-who{display:grid;text-align:left;line-height:1.15}
.c-who b{font-size:max(13px,1.9cqi)}
.c-who span{font-size:max(12px,1.6cqi);font-variant-numeric:tabular-nums;opacity:.85}
.tag{font:700 max(10px,1.3cqi)/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:.35em .6em;border-radius:5px;background:var(--b-ink);color:var(--b-bg)}
.c-msg{margin:0;font-size:max(12px,1.7cqi);max-width:58cqi;line-height:1.35;min-height:2.7em;text-wrap:balance}
.c-warn{margin:0;font-size:max(12px,1.6cqi);font-weight:700;max-width:58cqi}
.card-pop{background:var(--b-bg);border:2px solid var(--b-accent);border-radius:10px;padding:max(8px,1.3cqi) max(12px,2cqi);max-width:min(100%,58cqi);animation:pop .28s ease-out;box-shadow:0 4px 0 color-mix(in srgb,var(--b-accent) 30%,transparent)}
.card-k{font:800 max(12px,1.6cqi)/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--b-accent)}
.card-pop p{margin:.35em 0 0;font-size:max(12px,1.7cqi);line-height:1.35}
.cardfx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;background:rgba(8,12,10,.35);animation:fade .2s ease-out;perspective:900px}
.cardfx.out{animation:fxout .3s ease-in forwards}
@keyframes fxout{to{opacity:0}}
.cf-card{width:min(260px,60vw,52vh);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;animation:cfin .9s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes cfin{0%{transform:translateY(60vh) rotateY(0) scale(.5)}45%{transform:translateY(0) rotateY(0) scale(1)}100%{transform:rotateY(180deg)}}
.cf-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center;text-align:center;box-shadow:0 18px 40px -10px rgba(0,0,0,.6);border:3px solid #fff}
.cf-back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px),var(--cfc);color:#fff}
.cf-back svg{width:45%;height:45%;fill:currentColor}
.cf-front{transform:rotateY(180deg);background:#FFFBEF;color:#2A2118;align-content:center;gap:10px;padding:16px;border-color:var(--cfc)}
.cf-front .ck{font:800 clamp(14px,4vh,20px)/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--cfc)}
.cf-front .ci{width:44px;height:44px;color:var(--cfc);margin:0 auto}.cf-front .ci svg{width:100%;height:100%;fill:currentColor}
.cf-front p{margin:0;font-size:clamp(13px,3.6vh,16px);line-height:1.35}

@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.c-actions{display:flex;gap:max(6px,1.1cqi);flex-wrap:wrap;justify-content:center}
.center .btn{font-size:max(13px,1.75cqi);background:var(--b-bg);color:var(--b-ink);border-color:var(--b-line)}
.center .btn.primary{background:var(--b-accent);border-color:var(--b-accent);color:var(--b-accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--b-accent) 55%,#000)}
.center .btn.danger{color:#D93A3A;border-color:#D93A3A;background:transparent}

/* dice */
.dice-row{display:flex;gap:max(8px,2cqi);justify-content:center}
.die{width:max(38px,8.4cqi);aspect-ratio:1;border-radius:20%;display:block;padding:0;box-sizing:border-box;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.25);flex:none}
.die svg{display:block;width:100%;height:100%;overflow:visible}
.pip.on{fill:var(--pip)}
.die.digit{display:grid;place-items:center;grid-template:none;padding:0}
.die.digit b{font:800 calc(1em + 0px) var(--f-display);font-size:inherit}
.dice-row .die.digit{font-size:max(24px,5.4cqi)}
.dice-row.rolling .die{animation:shake .14s linear infinite}
.dice-row.landed .die{animation:land .3s ease-out}
.dsum{align-self:center;font:800 max(20px,4.6cqi)/1 var(--f-display);color:var(--b-accent);animation:sumpop .45s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
@keyframes sumpop{from{transform:scale(0);opacity:0}}
.tile.dest{z-index:2;animation:destblink .5s ease-in-out infinite alternate}
@keyframes destblink{from{box-shadow:inset 0 0 0 max(2px,.35cqi) #F5C542}to{box-shadow:inset 0 0 0 max(4px,.7cqi) #F5C542,inset 0 0 3cqi rgba(245,197,66,.85);filter:brightness(1.15)}}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-8%)}75%{transform:rotate(12deg) translateY(4%)}}
@keyframes land{40%{transform:scale(1.12)}}
[data-dice="classic"] .die{background:#FBFAF6;--pip:#1B1B1B;color:#1B1B1B;border:1px solid #D3CFC4}
[data-dice="lucky"] .die{background:linear-gradient(145deg,#DA2A30,#A0101A);--pip:#F7D774;color:#F7D774;border:1px solid #7E0D13}
[data-dice="jade"] .die{background:linear-gradient(145deg,#86D0B7,#3C9075);--pip:#F4FFF9;color:#F4FFF9;border:1px solid #2F725D}
[data-dice="wood"] .die{background:linear-gradient(145deg,#E0B37A,#AF7A42);--pip:#3A2210;color:#3A2210;border:1px solid #87592C}
[data-dice="neon"] .die{background:#0C0E1B;--pip:#39FFB0;color:#39FFB0;border:1.5px solid #39FFB0;box-shadow:0 0 12px rgba(57,255,176,.45)}
[data-dice="neon"] .pip.on{filter:drop-shadow(0 0 2px #39FFB0)}
[data-dice="digit"] .die{background:#FBFAF6;color:#1B1B1B;border:1px solid #D3CFC4}

/* ---------- side ledger ---------- */
.side{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font:700 11.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ph h3{margin:0}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:9px}
.plist li.cur{background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.plist li.out{opacity:.45}
.plist li.out b{text-decoration:line-through}
.plist .tok,.rank .tok{--sz:32px}
.pmeta{min-width:0;display:grid}
.pmeta b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.chips i{width:8px;height:11px;border-radius:2px;display:block}
.chips i.m{opacity:.3}
.pmoney{font:700 16px/1 var(--f-body);font-variant-numeric:tabular-nums}
.pmoney.neg{color:var(--danger)}
.pot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.pot b{color:var(--ink);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
.deed{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.deed-head{padding:10px 12px;display:grid;gap:3px;text-align:center}
.deed-head span{font:700 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.deed-head b{font:800 23px/1.05 var(--f-display)}
.buydlg{max-width:340px;gap:12px;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.buydlg .deed{box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.buy-k{margin:0;text-align:center;font:700 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.buy-m{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.buydlg .dlg-act .btn{flex:1}
.buydlg .dnote{display:none}
@media (orientation:landscape) and (max-height:540px){.buydlg{padding:12px;gap:8px;max-width:320px}.buydlg .deed table{font-size:11.5px}.buydlg .deed td{padding:2px 10px}}
.deed table{width:100%;border-collapse:collapse;font-size:13px}
.deed td{padding:4px 12px}
.deed td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.deed tr.hl td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
.deed tr.sep td{border-top:1px solid var(--line)}
.deed .dnote{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.owner{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.owner .tok{--sz:22px;border-width:1.5px}
.manage{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sellto{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.sellto label{font-size:12px;color:var(--muted)}
.sellto .row{display:flex;gap:6px;flex-wrap:wrap}
.sellto select,.sellto input{font:500 14px var(--f-body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.sellto input{width:100px}
.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:grid;gap:7px;font-size:13px}
.log li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;align-items:baseline}
.log li i{width:8px;height:8px;border-radius:50%;display:block;background:var(--muted)}
.log li:first-child{font-weight:600}

/* ---------- setup ---------- */
.setup{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 56px;display:grid;gap:30px}
.s-hero{display:grid;gap:12px;padding-top:12px}
.s-hero h1{margin:0;font:800 clamp(46px,9vw,92px)/.86 var(--f-display);letter-spacing:-.02em;text-wrap:balance}

.peditor{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}

.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;background:var(--c);border:0;cursor:pointer;padding:0}

.sw:disabled{opacity:.18;cursor:not-allowed}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.picker{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:-4px}
.pk{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}
.pk-n{font:700 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}

.pk-t:disabled{opacity:.22;cursor:not-allowed}

.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

.sk-sub{font-size:12.5px;color:var(--muted);padding:0 6px 4px}
.dopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.dopt{border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:10px;padding:14px 8px 10px;font:600 13px var(--f-body)}

    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);}
  function tick(){const beat=.5;while(next<ac.currentTime+.6){const bar=Math.floor(step/8)%4,b=step%8,ch=CH[bar];
      if(b===0){ch.forEach(f=>note(f,next,beat*8,.05,'triangle'));note(ch[0]/2,next,beat*8,.07);}
      if(b%2===0)note(ch[(b/2)%3]*2,next,beat*1.6,.035);
      if(Math.random()<.35)note(MEL[Math.floor(Math.random()*MEL.length)],next+beat/2,beat*2,.03);

    start(){if(timer||CFG.mute||CFG.music===false)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();if(!out){out=ac.createGain();out.connect(ac.destination);}
      out.gain.cancelScheduledValues(ac.currentTime);out.gain.setValueAtTime(0,ac.currentTime);out.gain.linearRampToValueAtTime(.6,ac.currentTime+2);
      next=ac.currentTime+.1;timer=setInterval(tick,200);}catch(e){}},
    stop(){if(!timer)return;clearInterval(timer);timer=null;try{out.gain.cancelScheduledValues(ac.currentTime);out.gain.setValueAtTime(out.gain.value,ac.currentTime);out.gain.linearRampToValueAtTime(0,ac.currentTime+.4);}catch(e){}},

  function tone(f,d,{type='sine',vol=.3,t=0,slide=0}={}){const a=ctx();if(!a)return;const t0=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.02);}

function rentOf(i,sum){const t=T[i],o=S.own[i];if(!o||o.m)return 0;
  if(t.type==='prop'){if(o.lv>0)return t.rent[o.lv];
    const full=groupTiles(t.g).every(j=>S.own[j]&&S.own[j].o===o.o);return full?t.rent[0]*2:t.rent[0];}
  if(t.type==='station'){const n=STATIONS.filter(j=>S.own[j]&&S.own[j].o===o.o).length;return 25*2**(n-1);}
  if(t.type==='util'){const n=UTILS.filter(j=>S.own[j]&&S.own[j].o===o.o).length;return (sum||7)*(n===2?10:4);}
  return 0;}
function ownsGroup(i){const t=T[i],o=S.own[i];return t.type==='prop'&&o&&groupTiles(t.g).every(j=>S.own[j]&&S.own[j].o===o.o);}
function groupHasHouses(i){const t=T[i];return t.type==='prop'&&groupTiles(t.g).some(j=>S.own[j]&&S.own[j].lv>0);}
function canBuild(i){const t=T[i],o=S.own[i];if(!o||t.type!=='prop'||o.m||o.lv>=5||S.phase==='debt')return false;
  const g=groupTiles(t.g);if(!g.every(j=>S.own[j]&&S.own[j].o===o.o&&!S.own[j].m))return false;
  if(o.lv>Math.min(...g.map(j=>S.own[j].lv)))return false;
  return S.players[o.o].money>=t.hc;}
function canSellHouse(i){const t=T[i],o=S.own[i];if(!o||t.type!=='prop'||o.lv===0)return false;
  return o.lv>=Math.max(...groupTiles(t.g).map(j=>S.own[j]?S.own[j].lv:0));}
function canMortgage(i){const o=S.own[i];return o&&!o.m&&o.lv===0&&!groupHasHouses(i);}

      const x=u*u*(x0+jx)+2*u*t*mx+t*t*x1,y=u*u*(y0+jy)+2*u*t*my+t*t*y1,sc=t<.5?.55+t*1.1:1.1-(t-.5)*.9;
      fr.push({transform:`translate(${x}px,${y}px) scale(${sc}) rotateY(${t*720}deg)`,opacity:s===0?0:t>.94?.15:1});}
    const an=el.animate(fr,{duration:D,delay:c*48,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'both'});an.onfinish=()=>el.remove();}
  later(D*.85,()=>{if(isP(to)){floatAt(x1,y1-14,'+'+money(amt),'pos');flashRow(to,'hit-pos');}
    else if(to==='pot')floatAt(x1,y1,'+'+money(amt),'info');
    const t=isP(to)?anchorEl(to):null;if(t){t.classList.remove('recv');void t.offsetWidth;t.classList.add('recv');}});
  return wait(D+(n-1)*48);}
/* from/to: player index, null = ngân hàng, 'pot' = quỹ Bãi đỗ xe, {tile:i} = ngân hàng nhưng tiền bay về ô i */
function xfer(from,to,amt,opt={}){amt=Math.round(amt);if(!S||!(amt>0))return Promise.resolve();
  const old={};[from,to].forEach(k=>{if(isP(k)||k==='pot')old[k]=shown(k);});
  if(isP(to))SFX.coinIn();else SFX.coinOut();
  if(isP(from))S.players[from].money-=amt;else if(from==='pot')S.pot-=amt;
  if(isP(to))S.players[to].money+=amt;else if(to==='pot')S.pot+=amt;
  if(opt.debt&&isP(from))S.cred=isP(to)?to:null;
  const D=fxDur();
  if(from in old)tweenMoney(from,old[from],0,D*.55);
  if(to in old)tweenMoney(to,old[to],D*.8,D*.5);
  renderPlayers();
  return fxMoney(from,to,amt);}
function pay(p,to,amt,kind){return xfer(idx(p),to!=null?to:(kind==='tax'&&S.rules.parking?'pot':null),amt,{debt:true});}
function goJail(p){SFX.jail();p.pos=10;p.jail=true;p.jt=0;S.extra=false;S.dbl=0;renderDynamic();}
function settle(){const p=cp();if(S.phase==='gameover')return;
  if(p.money<0){S.debt={to:S.cred??null,after:(S.extra&&!p.jail)?'again':'end'};S.phase='debt';
    log(`${p.name} bị âm ${money(-p.money)}. Cần bán nhà hoặc cầm cố để trả nợ.`,S.cur);}
  else{S.debt=null;S.phase=(S.extra&&!p.jail)?'again':'end';}}

async function moveSteps(p,n){const dir=n>0?1:-1;
  const dest=tileEl((p.pos+n+400)%40);
  document.querySelectorAll('#board .tile.dest').forEach(e=>e.classList.remove('dest'));
  if(dest)dest.classList.add('dest');
  try{
  for(let k=0;k<Math.abs(n);k++){p.pos=(p.pos+dir+40)%40;
    renderDynamic();
    SFX.step();
    if(dir>0&&p.pos===0){SFX.go();log(`${p.name} đi qua Xuất phát, nhận ${money(S.rules.salary)}.`,idx(p));xfer(null,idx(p),S.rules.salary);}
    await wait(stepMs());}
  if(dest)await wait(400);
  }finally{if(dest)dest.classList.remove('dest');}}
async function moveTo(p,target){await moveSteps(p,(target-p.pos+40)%40||40);}

async function land(p,sum){const i=p.pos,t=T[i],me=S.cur;
  if(t.type==='prop'||t.type==='station'||t.type==='util'){const o=S.own[i];
    if(!o){if(p.money>=t.price){S.pending=i;S.phase='buy';log(`${p.name} đến ${tname(i)}. Ô còn trống, giá ${money(t.price)}.`,me);showBuyCard();return;}
      log(`${p.name} đến ${tname(i)} nhưng không đủ tiền mua.`,me);}
    else if(o.o===me)log(`${p.name} về ${tname(i)} của mình.`,me);
    else if(o.m)log(`${tname(i)} đang cầm cố nên ${p.name} không phải trả tiền thuê.`,me);
    else{const r=rentOf(i,sum);log(`${p.name} trả ${money(r)} tiền thuê ${tname(i)} cho ${S.players[o.o].name}.`,me);renderCenter();await pay(p,o.o,r);}
  }else if(t.type==='chance'||t.type==='chest'){await drawCard(p,t.type,sum);return;}
  else if(t.type==='tax'){log(`${p.name} nộp ${t.n.toLowerCase()} ${money(t.amt)}.`,me);renderCenter();await pay(p,null,t.amt,'tax');}
  else if(t.type==='gojail'){log(`${p.name} dừng ở ô Vào tù và bị đưa thẳng vào tù.`,me);renderCenter();await wait(stepMs()*3);goJail(p);}
  else if(t.type==='park'){if(S.rules.parking&&S.pot>0){log(`${p.name} nhận toàn bộ quỹ Bãi đỗ xe: ${money(S.pot)}.`,me);renderCenter();await xfer('pot',me,S.pot);}
    else log(`${p.name} nghỉ chân ở Bãi đỗ xe.`,me);}
  else if(t.type==='jail')log(`${p.name} ghé thăm nhà tù.`,me);
  else if(t.type==='go')log(`${p.name} dừng đúng ô Xuất phát.`,me);
  settle();}

  const amt=n*h+m*ho;log(`${p.name} có ${n} nhà, ${m} khách sạn: nộp ${money(amt)}.`,S.cur);await pay(p,null,amt,'tax');}
async function payEach(p,amt){await Promise.all(S.players.map((q,j)=>j!==S.cur&&!q.bankrupt?pay(p,j,amt):null));}
async function collectEach(p,amt){await Promise.all(S.players.map((q,j)=>j!==S.cur&&!q.bankrupt?xfer(j,S.cur,amt):null));}

async function showCardFx(deck,dn,text){
  const ic=deck==='chance'?IC.q:IC.star,col=deck==='chance'?'#D9472B':'#2F7FC1';
  const fx=document.createElement('div');fx.className='cardfx';fx.style.setProperty('--cfc',col);
  fx.innerHTML=`<div class="cf-card"><div class="cf-face cf-back">${ic}</div><div class="cf-face cf-front"><span class="ci">${ic}</span><span class="ck">${esc(dn)}</span><p>${esc(text)}</p></div></div>`;
  document.body.appendChild(fx);SFX.card();
  await wait(900+Math.max(1400,readMs()));
  fx.classList.add('out');await wait(300);fx.remove();}
async function drawCard(p,deck,sum){const c=CARDS[deck][Math.floor(Math.random()*CARDS[deck].length)];
  const text=c.t();const dn=deck==='chance'?SK().chance:SK().chest;
  S.card={deck,text};log(`${p.name} rút thẻ ${dn}: ${text}`,S.cur);renderCenter();
  await showCardFx(deck,dn,text);
  const again=await c.f(p);renderPlayers();
  if(again){await land(p,sum);return;}
  settle();}

async function doRoll(){if(busy||!S||!(S.phase==='roll'||S.phase==='again'))return;buildMode=false;
  busy=true;S.card=null;S.showSum=false;renderCenter();const p=cp();
  const d=[rand6(),rand6()];await animateDice(d);S.dice=d;S.showSum=true;const sum=d[0]+d[1],dbl=d[0]===d[1];
  if(p.jail){
    if(dbl){p.jail=false;p.jt=0;S.extra=false;log(`${p.name} đổ được đôi ${d[0]}–${d[1]} và ra tù.`,S.cur);await moveSteps(p,sum);await land(p,sum);}
    else{p.jt++;
      if(p.jt>=3){await pay(p,null,50,'tax');p.jail=false;p.jt=0;S.extra=false;log(`${p.name} ở tù đủ 3 lượt, nộp ${money(50)} rồi đi ${sum} bước.`,S.cur);await moveSteps(p,sum);await land(p,sum);}
      else{S.extra=false;log(`${p.name} đổ ${d[0]}–${d[1]}, chưa được đôi. Vẫn ở tù (lần ${p.jt}/3).`,S.cur);settle();}}
  }else{
    if(dbl){S.dbl++;if(S.dbl>=3){log(`${p.name} đổ đôi 3 lần liền nên phải vào tù.`,S.cur);goJail(p);settle();busy=false;renderAll();save();return;}}
    else S.dbl=0;
    S.extra=dbl;log(`${p.name} đổ ${d[0]}–${d[1]}${dbl?' (đôi!)':''}, đi ${sum} bước.`,S.cur);
    await moveSteps(p,sum);await land(p,sum);}
  busy=false;renderAll();save();}

async function animateDice(d){const row=$('#dice');const ms=diceMs();
  if(row&&ms>0){row.classList.remove('landed');row.classList.add('rolling');const t0=performance.now();
    while(performance.now()-t0<ms){row.innerHTML=dieHTML(rand6())+dieHTML(rand6());SFX.rattle();await wait(70);}
    row.classList.remove('rolling');}
  if(row){row.innerHTML=dieHTML(d[0])+dieHTML(d[1])+`<b class="dsum">= ${d[0]+d[1]}</b>`;row.classList.add("landed");}SFX.land();}

function doBuy(){if(S.phase!=='buy')return;SFX.buy();if(modalKind==='buy')closeModal();const p=cp(),i=S.pending;S.own[i]={o:S.cur,lv:0,m:false};
  log(`${p.name} mua ${tname(i)} với giá ${money(T[i].price)}.`,S.cur);
  const full=T[i].type==='prop'&&ownsGroup(i);
  if(full)log(`${p.name} đã có trọn bộ màu! Tiền thuê nhóm này tăng gấp đôi và giờ có thể xây nhà.`,S.cur);
  if(fxOn())VIS.hideOwn[i]=true;
  xfer(S.cur,{tile:i},T[i].price);
  later(fxDur()*.85,()=>{delete VIS.hideOwn[i];renderDynamic();const el=tileEl(i);
    if(el){el.classList.remove('bought');void el.offsetWidth;el.classList.add('bought');setTimeout(()=>el.classList.remove('bought'),600);
      if(full)floatOn(el,'Trọn bộ màu!','info',150);}});
  S.pending=null;settle();renderAll();save();}
const tileEl = i=>document.querySelector(`#board .tile[data-i="${i}"]`);
const VIS={hideOwn:{},hideLv:{},drop:{}};
function doSkip(){if(S.phase!=='buy')return;if(modalKind==="buy")closeModal();const p=cp(),i=S.pending;log(`${p.name} bỏ qua ${tname(i)}.`,S.cur);S.pending=null;settle();renderAll();save();}
function showBuyCard(){if(!S||S.phase!=='buy'||S.pending==null)return;const i=S.pending,p=cp(),prev=sel;
  sel=i;renderDetail();const d=$('#detail .deed');const deed=d?d.outerHTML:'';sel=prev;renderDetail();
  showModal(`<div class="dlg buydlg" role="dialog" aria-label="Mua ${esc(tname(i))}">${deed}
    <p class="buy-m">Tiền hiện có: <b>${money(p.money)}</b> → còn <b>${money(p.money-T[i].price)}</b></p>
    <div class="dlg-act"><button class="btn" data-act="skip">Bỏ qua</button><button class="btn primary" data-act="buy">Mua · ${money(T[i].price)}</button></div></div>`,'buy');}
function endTurn(){if(busy||S.phase!=='end')return;S.card=null;S.showSum=false;S.dbl=0;S.extra=false;nextPlayer();}
function nextPlayer(){let n=S.cur;do{n=(n+1)%S.players.length;}while(S.players[n].bankrupt);
  S.cur=n;S.turnNo++;S.cred=null;buildMode=false;const p=cp();
  if(p.money<0){S.phase='debt';S.debt={to:null,after:'roll'};log(`${p.name} đang âm ${money(-p.money)}, cần xoay tiền trước khi đổ.`,n);}
  else{S.phase='roll';S.msg=p.jail?`${p.name} đang ở tù (đã chờ ${p.jt}/3 lượt). Đổ được đôi để ra tù.`:`Đến lượt ${p.name}. Chuyền máy cho ${p.name} nhé.`;}
  renderAll();save();}
function declareBankrupt(){const me=S.cur,p=cp(),to=S.debt?S.debt.to:null;
  for(const k in S.own){const o=S.own[k];if(o.o!==me)continue;
    if(to!=null){S.players[to].money+=o.lv*(T[k].hc||0)/2;o.o=to;o.lv=0;}else delete S.own[k];}
  if(to!=null)S.players[to].money+=p.money;
  p.money=0;p.bankrupt=true;p.jail=false;p.cards=0;S.debt=null;S.card=null;
  log(`${p.name} tuyên bố phá sản.${to!=null?` Toàn bộ đất chuyển cho ${S.players[to].name}.`:' Đất trả về ngân hàng.'}`,me);
  const alive=S.players.filter(q=>!q.bankrupt);
  if(alive.length===1){SFX.win();S.phase='gameover';S.winner=S.players.indexOf(alive[0]);log(`${alive[0].name} thắng ván này!`,S.winner);renderAll();save();showRanking('Có người thắng rồi');return;}
  S.extra=false;S.dbl=0;nextPlayer();}
function finishByWorth(){let best=-1,bw=-Infinity;S.players.forEach((p,i)=>{if(!p.bankrupt&&worth(i)>bw){bw=worth(i);best=i;}});
  SFX.win();S.phase='gameover';S.winner=best;S.card=null;log(`Ván kết thúc. ${S.players[best].name} giàu nhất với ${money(bw)}.`,best);renderAll();save();showRanking('Kết thúc ván');}

/* property management */
function manage(kind,i){if(busy||!S||S.phase==='gameover')return;const o=S.own[i];if(!o)return;const p=S.players[o.o],t=T[i],pi=o.o;
  if(kind==='build'&&canBuild(i)){SFX.build();o.lv++;const lv=o.lv;
    log(`${p.name} ${lv===5?'nâng khách sạn':'xây nhà thứ '+lv} ở ${tname(i)} (−${money(t.hc)}).`,pi);
    if(fxOn())VIS.hideLv[i]=(VIS.hideLv[i]||0)+1;
    xfer(pi,{tile:i},t.hc);
    later(fxDur()*.85,()=>{if(VIS.hideLv[i])VIS.hideLv[i]--;VIS.drop[i]=true;renderDynamic();delete VIS.drop[i];
      const el=tileEl(i);if(el){el.classList.remove('thud');void el.offsetWidth;el.classList.add('thud');
        floatOn(el,lv===5?'Khách sạn!':`Nhà ${lv}`,'info',380);}});}
  else if(kind==='sellh'&&canSellHouse(i)){o.lv--;log(`${p.name} bán bớt nhà ở ${tname(i)} (+${money(t.hc/2)}).`,pi);xfer({tile:i},pi,t.hc/2);}
  else if(kind==='mort'&&canMortgage(i)){o.m=true;log(`${p.name} cầm cố ${tname(i)} (+${money(t.price/2)}).`,pi);xfer({tile:i},pi,t.price/2);}
  else if(kind==='unmort'&&canUnmort(i)){const c=unmortCost(i);o.m=false;log(`${p.name} chuộc lại ${tname(i)} (−${money(c)}).`,pi);xfer(pi,{tile:i},c);}
  else return;
  renderAll();save();}
function sellTo(i){if(busy||!S)return;const o=S.own[i];if(!o||groupHasHouses(i))return;
  const b=+$('#buyer').value,price=Math.max(0,Math.round(+$('#sellprice').value||0));const buyer=S.players[b],seller=S.players[o.o];
  if(!buyer||buyer.bankrupt||b===o.o)return;
  if(buyer.money<price){$('#sellmsg').textContent=`${buyer.name} chỉ có ${money(buyer.money)}, không đủ trả ${money(price)}.`;return;}
  xfer(b,o.o,price);log(`${seller.name} bán ${tname(i)} cho ${buyer.name} với giá ${money(price)}.`,o.o);o.o=b;renderAll();save();}

function renderTop(){const t=$('#top');
  let nav='';
  if(view==='game')nav=`<button class="btn ghost sm" data-act="mute" aria-label="Bật/tắt âm thanh">${CFG.mute?'🔇':'🔊'}</button><button class="btn ghost sm" data-act="music" aria-label="Bật/tắt nhạc nền" style="${CFG.music===false||CFG.mute?'opacity:.45':''}">🎵</button><button class="btn ghost sm" data-act="open-drawer">Tùy chỉnh</button><button class="btn ghost sm" data-act="rank">Xếp hạng</button>${S.phase!=='gameover'?'<button class="btn ghost sm" data-act="endgame">Kết thúc ván</button>':''}<button class="btn ghost sm" data-act="newgame">Ván mới</button>`;
  else if(S&&S.phase!=='gameover')nav=`<button class="btn ghost sm" data-act="resume">Quay lại ván đang chơi</button>`;
  t.innerHTML=`<div class="brand"><span class="dice-row" data-dice="${CFG.dice}">${dieHTML(5)}</span>Cờ Tỷ Phú</div><nav>${nav}</nav>`;
  document.body.dataset.view=view;try{BGM.sync();}catch(e){}
  const m=$('#mini');if(m&&view==='game')m.innerHTML=`<span class="mini-name">${SK().name}</span><nav>${nav.replace(/Kết thúc ván/,'Kết thúc')}<button class="btn primary sm x-sheet" data-act="close-sheet">Đóng</button></nav>`;
  if(view!=='game')closeSheet();}

function render(){if(view==='setup')renderSetup();else renderGame();renderTop();}
function renderGame(){$('#main').innerHTML=`<div class="layout" data-skin="${CFG.skin}">
  <div class="board-wrap"><div class="board" id="board">${T.map((_,i)=>tileHTML(i)).join('')}<div class="center" id="center"></div></div></div>
  <aside class="side"><div class="mini" id="mini"></div><section class="panel" id="players"></section><section class="panel" id="detail"></section>
  <section class="panel"><h3>Nhật ký ván</h3><ol class="log" id="log"></ol></section></aside></div>`;renderAll();}
function renderAll(){if(view!=='game'||!S)return;renderDynamic();renderCenter();renderPlayers();renderDetail();renderLog();renderTop();}
let buildMode=false;
const buildable = k=>Object.keys(S.own).map(Number).filter(i=>S.own[i].o===k&&canBuild(i));
function priceLabel(i){const t=T[i],o=S.own[i];
  if(!o||VIS.hideOwn[i])return ['tprice',money(t.price),''];
  if(o.m)return ['tprice mortl','Cầm cố',''];
  const c=S.players[o.o].color,st=`--oc:${c};--oi:${inkOn(c)}`;
  if(t.type==='util')return ['tprice rent','×'+(UTILS.filter(j=>S.own[j]&&S.own[j].o===o.o).length===2?10:4),st];
  return ['tprice rent',money(rentOf(i)),st];}
function renderDynamic(){if(!$('#board'))return;
  const bset=new Set(buildMode&&S.phase!=='gameover'?buildable(S.cur):[]);
  const order=S.players.map((p,k)=>k).sort((a,b)=>(a===S.cur)-(b===S.cur));
  document.querySelectorAll('#board .tile').forEach(el=>{const i=+el.dataset.i,t=T[i],o=VIS.hideOwn[i]?null:S.own[i];
    el.classList.toggle('mort',!!(o&&o.m));el.classList.toggle('sel',sel===i);
    el.classList.toggle('can-build',bset.has(i));el.classList.toggle('dim',buildMode&&!bset.has(i));
    let bb=el.querySelector('.bb');
    if(bset.has(i)){if(!bb){bb=document.createElement('span');bb.className='bb';el.appendChild(bb);}
      bb.textContent=(S.own[i].lv===4?'+ Khách sạn ':'+ Nhà ')+money(t.hc);}else if(bb)bb.remove();
    const own=el.querySelector('.own');if(own)own.style.background=o?S.players[o.o].color:'transparent';
    const tp=el.querySelector('.tprice');
    if(tp&&t.price){const [c,txt,st]=priceLabel(i);if(tp.className!==c)tp.className=c;if(tp.textContent!==txt)tp.textContent=txt;if(tp.getAttribute('style')!==st)tp.setAttribute('style',st);}
    const h=el.querySelector('.houses');
    if(h){const lv=o?Math.max(0,o.lv-(VIS.hideLv[i]||0)):0;
      if(h.dataset.lv!==String(lv)){const d=VIS.drop[i]&&lv>(+h.dataset.lv||0);h.dataset.lv=lv;
        if(lv===5)h.innerHTML=`<i class="hotel${d?' drop':''}"></i>`;
        else h.innerHTML=Array.from({length:lv},(_,k)=>`<i class="house${d&&k===lv-1?' drop':''}"></i>`).join('');}}
    el.querySelector('.toks').innerHTML=order.map(k=>{const p=S.players[k];return (!p.bankrupt&&p.pos===i)?`<span class="tok${k===S.cur&&S.phase!=='gameover'?' cur':''}${p.jail?' jailed':''}" data-p="${k}" style="--pc:${p.color}" title="${esc(p.name)}">${tokEmoji(p.token)}</span>`:'';}).join('');});}
function actionsHTML(){const p=cp(),dis=busy?'disabled':'';
  if(buildMode&&S.phase!=='gameover')return `<button class="btn primary" data-act="buildmode">Xây xong</button>`;
  const bbtn=!busy&&['roll','again','end','debt'].includes(S.phase)&&S.phase!=='debt'&&buildable(S.cur).length?`<button class="btn" data-act="buildmode">Xây nhà</button>`:'';
  return actionsCore(p,dis)+bbtn;}
function actionsCore(p,dis){
  switch(S.phase){
    case 'roll':if(p.jail)return `<button class="btn primary" data-act="roll" ${dis}>Đổ tìm đôi</button><button class="btn" data-act="payjail" ${busy||p.money<50?'disabled':''}>Nộp ${money(50)} ra tù</button>${p.cards?`<button class="btn" data-act="usecard" ${dis}>Dùng thẻ ra tù (${p.cards})</button>`:''}`;
      return `<button class="btn primary" data-act="roll" ${dis}>Đổ xúc xắc</button>`;
    case 'again':return `<button class="btn primary" data-act="roll" ${dis}>Được đôi, đổ tiếp</button>`;
    case 'buy':return modalKind==='buy'?'':`<button class="btn primary" data-act="showbuy">Xem sổ đỏ</button>`;
    case 'end':return `<button class="btn primary" data-act="end" ${dis}>Kết thúc lượt</button>`;
    case 'debt':return `<button class="btn primary" data-act="paydebt" ${p.money<0?'disabled':''}>Đã đủ tiền, tiếp tục</button><button class="btn danger" data-act="askbankrupt">Phá sản</button>`;
    case 'gameover':return `<button class="btn primary" data-act="newgame">Ván mới</button><button class="btn" data-act="rank">Bảng xếp hạng</button>`;}
  return '';}
function renderCenter(){const c=$('#center');if(!c)return;const s=SK(),over=S.phase==='gameover';
  const p=over&&S.winner!=null?S.players[S.winner]:cp();
  let msg=S.card?`<div class="card-pop"><span class="card-k">${S.card.deck==='chance'?s.chance:s.chest}</span><p>${esc(S.card.text)}</p></div>`:`<p class="c-msg">${esc(S.msg||'')}</p>`;
  if(buildMode&&S.phase!=='gameover'){const n=buildable(S.cur).length;
    msg=`<p class="c-msg">${n?`Chạm vào ô đang sáng để xây. Nhà phải xây đều trong cùng nhóm màu, đủ 4 nhà thì nâng lên khách sạn.`:`Hết ô xây được: nhóm màu đã xây đều tối đa hoặc không đủ tiền.`}</p>`;}
  if(S.phase==='debt')msg+=`<p class="c-warn">Đang âm ${money(-cp().money)}. Bấm vào ô đất của ${esc(cp().name)} để bán nhà hoặc cầm cố.</p>`;
  c.innerHTML=`<div class="c-title"><span class="c-kicker">Cờ Tỷ Phú</span><span class="c-name">${s.name}</span></div>
   <div class="c-turn"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span><span class="c-who"><b>${over?'Người thắng: ':''}${esc(p.name)}</b>${over?`<span>${money(worth(S.winner))}</span>`:mspan(idx(p))}</span>${!over&&p.jail?'<span class="tag">Ở tù</span>':''}</div>
   <div class="dice-row" id="dice" data-dice="${CFG.dice}">${dieHTML(S.dice[0])}${dieHTML(S.dice[1])}${S.showSum?`<b class="dsum">= ${S.dice[0]+S.dice[1]}</b>`:""}</div>
   <div class="c-msgs">${msg}</div><div class="c-actions">${actionsHTML()}</div><div class="cpl" id="cpl">${cplHTML()}</div>`;}
function cplHTML(){if(!S)return '';
  return `<div class="cpl-h"><span>Lượt ${S.turnNo}</span><button class="btn sm" data-act="menu">Sổ đỏ · Menu</button></div>`+
    S.players.map((p,i)=>`<div class="cpl-row${i===S.cur&&S.phase!=='gameover'?' cur':''}${p.bankrupt?' out':''}" data-p="${i}"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span><span><b>${esc(p.name)}</b>${p.jail&&!p.bankrupt?'<span class="tag">Tù</span>':''}</span>${p.bankrupt?'<span>Phá sản</span>':mspan(i)}</div>`).join('')+
    (S.rules.parking?`<div class="cpl-pot">Quỹ bãi đỗ: ${mspan('pot')}</div>`:'');}
const landMq=window.matchMedia?matchMedia('(orientation: landscape) and (max-height: 540px)'):{matches:false};
function openSheet(){document.body.classList.add('sheet');}
function closeSheet(){document.body.classList.remove('sheet');}
function chipColor(k){const t=T[k];return t.type==='prop'?SK().g[t.g]:t.type==='station'?'#7A7F86':'#B4B8BD';}
function renderPlayers(){const c=$('#cpl');if(c)c.innerHTML=cplHTML();const el=$('#players');if(!el)return;
  el.innerHTML=`<div class="ph"><h3>Người chơi</h3><span class="hint">Lượt ${S.turnNo}</span></div><ul class="plist">`+S.players.map((p,i)=>{
    const props=Object.keys(S.own).map(Number).filter(k=>S.own[k].o===i).sort((a,b)=>a-b);
    const chips=props.map(k=>`<i class="${S.own[k].m?'m':''}" style="background:${chipColor(k)}" title="${esc(tname(k))}${S.own[k].m?' (cầm cố)':''}"></i>`).join('');
    const st=p.bankrupt?'Phá sản':[p.jail?'Đang ở tù':'',p.cards?`${p.cards} thẻ ra tù`:'',props.length?`${props.length} tài sản`:'Chưa có đất'].filter(Boolean).join(' · ');
    return `<li data-p="${i}" class="${i===S.cur&&S.phase!=='gameover'?'cur':''}${p.bankrupt?' out':''}"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span><div class="pmeta"><b>${esc(p.name)}</b><span class="pstat">${st}</span>${chips?`<div class="chips">${chips}</div>`:''}</div>${mspan(i,'pmoney')}</li>`;}).join('')+'</ul>'+
    (S.rules.parking?`<div class="pot">Quỹ Bãi đỗ xe: <b>${mspan('pot')}</b></div>`:'');}
function renderLog(){const el=$('#log');if(el)el.innerHTML=S.log.slice(0,60).map(l=>`<li><i style="${l.c?`background:${l.c}`:''}"></i><span>${esc(l.t)}</span></li>`).join('');}
function renderDetail(){const el=$('#detail');if(!el)return;
  if(sel==null){el.innerHTML=`<h3>Sổ đỏ</h3><p class="hint">Bấm vào một ô trên bàn cờ để xem giá, tiền thuê và quản lý tài sản: xây nhà, cầm cố hoặc bán cho người khác.</p>`;return;}
  const i=sel,t=T[i],o=S.own[i],nm=esc(tname(i)),s=SK();let html='<h3>Sổ đỏ</h3>';
  if(t.type==='prop'||t.type==='station'||t.type==='util'){
    const hc=t.type==='prop'?s.g[t.g]:t.type==='station'?'#3E444C':'#8A9097';
    let rows='';const cur=o&&!o.m?(t.type==='prop'?(o.lv>0?o.lv+1:(ownsGroup(i)?1:0)):-1):-9;
    if(t.type==='prop'){const L=[['Tiền thuê',t.rent[0]],['Trọn bộ màu',t.rent[0]*2],['Có 1 nhà',t.rent[1]],['Có 2 nhà',t.rent[2]],['Có 3 nhà',t.rent[3]],['Có 4 nhà',t.rent[4]],['Khách sạn',t.rent[5]]];
      const hl=o&&!o.m?(o.lv>0?o.lv+1:(ownsGroup(i)?1:0)):-1;
      rows=L.map((r,k)=>`<tr class="${k===hl?'hl':''}"><td>${r[0]}</td><td>${money(r[1])}</td></tr>`).join('')+`<tr class="sep"><td>Giá mỗi nhà</td><td>${money(t.hc)}</td></tr>`;}
    else if(t.type==='station'){const n=o?STATIONS.filter(j=>S.own[j]&&S.own[j].o===o.o).length:0;
      rows=[1,2,3,4].map(k=>`<tr class="${k===n&&!o.m?'hl':''}"><td>Sở hữu ${k} ${esc(s.stWord.split(' ')[0])}</td><td>${money(25*2**(k-1))}</td></tr>`).join('');}
    else{const n=o?UTILS.filter(j=>S.own[j]&&S.own[j].o===o.o).length:0;
      rows=`<tr class="${n===1&&!o.m?'hl':''}"><td>Sở hữu 1 ô tiện ích</td><td>4 × số xúc xắc</td></tr><tr class="${n===2&&!o.m?'hl':''}"><td>Sở hữu cả 2 ô</td><td>10 × số xúc xắc</td></tr>`;}
    html+=`<div class="deed"><div class="deed-head" style="background:${hc};color:${inkOn(hc)}"><span>Giấy chứng nhận</span><b>${nm}</b></div>
      <table><tr><td>Giá mua</td><td>${money(t.price)}</td></tr>${rows}<tr class="sep"><td>Cầm cố được</td><td>${money(t.price/2)}</td></tr></table>
      ${o?'':`<div class="dnote">Chưa có chủ.</div>`}</div>`;
    if(o){const p=S.players[o.o];const st=o.m?'Đang cầm cố':t.type==='prop'?(o.lv===5?'Có khách sạn':o.lv?`Có ${o.lv} nhà`:'Đất trống'):'';
      html+=`<div class="owner"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span><span>Chủ: <b>${esc(p.name)}</b>${st?' · '+st:''}</span></div>`;
      if(!p.bankrupt&&S.phase!=='gameover'){const d=busy?'disabled':'';const b=[];
        if(t.type==='prop'){b.push(`<button class="btn sm primary" data-act="build" data-i="${i}" ${canBuild(i)&&!busy?'':'disabled'}>${o.lv===4?'Nâng khách sạn':'Xây nhà'} −${money(t.hc)}</button>`);
          if(o.lv>0)b.push(`<button class="btn sm" data-act="sellh" data-i="${i}" ${canSellHouse(i)&&!busy?'':'disabled'}>Bán nhà +${money(t.hc/2)}</button>`);}
        if(!o.m)b.push(`<button class="btn sm" data-act="mort" data-i="${i}" ${canMortgage(i)&&!busy?'':'disabled'}>Cầm cố +${money(t.price/2)}</button>`);
        else b.push(`<button class="btn sm" data-act="unmort" data-i="${i}" ${canUnmort(i)&&!busy?'':'disabled'}>Chuộc lại −${money(unmortCost(i))}</button>`);
        html+=`<div class="manage">${b.join('')}</div>`;
        if(t.type==='prop'&&!ownsGroup(i))html+=`<p class="hint" style="margin-top:8px">Cần sở hữu cả nhóm màu mới được xây nhà. Nhà phải xây đều trong nhóm.</p>`;
        else if(t.type==='prop'&&groupHasHouses(i)&&!o.m)html+=`<p class="hint" style="margin-top:8px">Bán hết nhà trong nhóm màu trước khi cầm cố hoặc bán đất.</p>`;
        const others=S.players.map((q,k)=>({q,k})).filter(x=>x.k!==o.o&&!x.q.bankrupt);
        if(others.length&&!groupHasHouses(i))html+=`<div class="sellto"><label for="buyer">Bán cho người chơi khác (hai bên thỏa thuận tại chỗ)</label><div class="row">
          <select id="buyer">${others.map(x=>`<option value="${x.k}">${esc(x.q.name)}</option>`).join('')}</select>
          <input id="sellprice" type="number" min="0" step="10" value="${t.price}" aria-label="Giá bán">
          <button class="btn sm" data-act="sellto" data-i="${i}" ${d}>Bán</button></div><span class="hint" id="sellmsg"></span></div>`;}}
  }else{const txt={chance:`Dừng ở đây thì rút một thẻ ${s.chance}: có thể được tiền, mất tiền hoặc phải di chuyển.`,
      chest:`Dừng ở đây thì rút một thẻ ${s.chest}: thường là các khoản thu chi bất ngờ.`,
      tax:`Nộp ${money(t.amt)} cho ngân hàng${S.rules.parking?' (dồn vào quỹ Bãi đỗ xe)':''}.`,
      go:`Mỗi lần đi qua hoặc dừng ở đây nhận ${money(S.rules.salary)}.`,
      jail:'Người bị vào tù phải đổ được đôi, nộp phạt hoặc dùng thẻ để ra. Tối đa 3 lượt. Dừng đúng ô này thì chỉ là ghé thăm.',
      park:S.rules.parking?`Dừng ở đây nhận toàn bộ quỹ, hiện có ${money(S.pot)}.`:'Ô nghỉ chân, không có gì xảy ra.',
      gojail:'Dừng ở đây thì bị đưa thẳng vào tù, không nhận lương Xuất phát.'}[t.type];
    html+=`<div class="deed"><div class="deed-head" style="background:${s.accent};color:${s.accentInk}"><span>Ô đặc biệt</span><b>${nm}</b></div><div class="dnote" style="border:0">${txt}</div></div>`;}
  el.innerHTML=html;}

/* setup & customization */
function playerEditor(ctx){const list=ctx==='setup'?draft.players:S.players;
  const taken=list.map(p=>p.token),takenC=list.map(p=>p.color);
  return '<div class="peditor">'+list.map((p,k)=>{const open=pickOpen&&pickOpen.ctx===ctx&&pickOpen.k===k;
    return `<div class="prow${p.bankrupt?' out':''}">
      <button class="tokbtn" data-act="pick" data-ctx="${ctx}" data-k="${k}" aria-label="Đổi nhân vật của ${esc(p.name)}" aria-expanded="${open}"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span></button>
      <input class="pname" id="pn-${ctx}-${k}" data-ctx="${ctx}" data-k="${k}" value="${esc(p.name)}" maxlength="16" aria-label="Tên người chơi ${k+1}" autocomplete="off">
      <div class="swatches">${COLORS.map(c=>`<button class="sw${c===p.color?' on':''}" style="--c:${c}" data-act="col" data-ctx="${ctx}" data-k="${k}" data-c="${c}" ${takenC.includes(c)&&c!==p.color?'disabled':''} aria-label="Chọn màu"></button>`).join('')}</div>
      ${ctx==='setup'&&list.length>2?`<button class="x" data-act="remp" data-k="${k}" aria-label="Bỏ người chơi này">×</button>`:''}
    </div>${open?`<div class="picker">${PACKS.map(pk=>`<div class="pk"><span class="pk-n">${pk.n}</span><div class="pk-g">${pk.items.map(t=>`<button class="pk-t${t.id===p.token?' on':''}" data-act="tok" data-ctx="${ctx}" data-k="${k}" data-t="${t.id}" ${taken.includes(t.id)&&t.id!==p.token?'disabled':''} title="${t.n}" aria-label="${t.n}">${t.e}</button>`).join('')}</div></div>`).join('')}</div>`:''}`;}).join('')+'</div>';}
function skinCards(){return '<div class="skins">'+Object.entries(SKINS).map(([id,s])=>`<button class="skin${CFG.skin===id?' on':''}" data-act="skin" data-s="${id}" data-skin="${id}" aria-pressed="${CFG.skin===id}">
  <span class="sk-board"><span class="sk-chips">${s.g.map(c=>`<i style="background:${c}"></i>`).join('')}</span><span class="sk-name">${s.name}</span><span class="sk-sample">${s.props[0]} → ${s.props[21]}</span></span><span class="sk-sub">${s.sub}</span></button>`).join('')+'</div>';}
function diceCards(){return '<div class="dopts">'+DICE.map(([id,n])=>`<button class="dopt${CFG.dice===id?' on':''}" data-act="dice" data-d="${id}" aria-pressed="${CFG.dice===id}"><span class="dice-row sm" data-dice="${id}">${dieHTML(5,id)}${dieHTML(3,id)}</span>${n}</button>`).join('')+'</div>';}
function seg(act,opts,cur){return `<div class="seg" role="group">${opts.map(([v,l])=>`<button data-act="${act}" data-v="${v}" class="${String(cur)===String(v)?'on':''}" aria-pressed="${String(cur)===String(v)}">${l}</button>`).join('')}</div>`;}
function renderSetup(){const s=SK();
  $('#main').innerHTML=`<div class="setup">
   <header class="s-hero"><h1>Cờ <em>Tỷ Phú</em></h1><div class="s-strip">${s.g.map(c=>`<i style="background:${c}"></i>`).join('')}</div>
    <p>Chơi chung một máy, từ 2 đến 6 người. Chọn bản đồ, nhân vật và kiểu xúc xắc, rồi chuyền máy cho nhau sau mỗi lượt. Ván đang chơi được tự động lưu trên trình duyệt này.</p></header>
   <section><div class="s-h"><h2>Người chơi</h2><button class="btn sm" data-act="addp" ${draft.players.length>=6?'disabled':''}>Thêm người chơi</button></div>
    <p class="hint">Bấm vào nhân vật để đổi hình, chọn màu bên cạnh.</p>${playerEditor('setup')}</section>
   <section><h2>Bản đồ</h2>${skinCards()}</section>
   <section><h2>Xúc xắc</h2>${diceCards()}</section>
   <section><h2>Luật chơi</h2><div class="rules">
    <div class="rule"><span>Tiền khởi đầu</span>${seg('startm',[1000,1500,2000,3000].map(v=>[v,money(v)]),draft.start)}</div>
    <div class="rule"><span>Lương qua Xuất phát</span>${seg('salary',[100,200,300].map(v=>[v,money(v)]),draft.salary)}</div>
    <div class="rule"><span>Tốc độ hiệu ứng<small>Đổi được trong ván</small></span>${seg('speed',SPEEDS,CFG.speed)}</div>
    <div class="rule"><span>Quỹ Bãi đỗ xe<small>Luật nhà phổ biến</small></span><label class="switch"><input type="checkbox" id="opt-parking" ${draft.parking?'checked':''}> Tiền thuế và phạt dồn vào quỹ, ai dừng ở Bãi đỗ xe nhận hết</label></div>
   </div></section>
   <div class="s-go"><button class="btn primary xl" data-act="startgame">Bắt đầu ván</button></div></div>`;}
function renderDrawer(){const old=document.querySelector('#modal .dlg');const st=old?old.scrollTop:0;
  showModal(`<div class="dlg wide" role="dialog" aria-label="Tùy chỉnh"><div class="dlg-h"><h2>Tùy chỉnh</h2><button class="x" data-act="close-modal" aria-label="Đóng">×</button></div>
    <section><h3>Bản đồ</h3>${skinCards()}</section><section><h3>Xúc xắc</h3>${diceCards()}</section>
    <section><h3>Tốc độ hiệu ứng</h3>${seg('speed',SPEEDS,CFG.speed)}</section>
    <section><h3>Nhân vật</h3>${playerEditor('drawer')}</section>
    <div class="dlg-act"><button class="btn primary" data-act="close-modal">Xong</button></div></div>`,'drawer');
  const d=document.querySelector('#modal .dlg');if(d)d.scrollTop=st;}
function showModal(html,kind='dlg'){closeSheet();modalKind=kind;$('#modal').innerHTML=`<div class="overlay" data-act="backdrop">${html}</div>`;}
function closeModal(){modalKind=null;pickOpen=null;$('#modal').innerHTML='';}
function showRanking(title){const order=S.players.map((p,i)=>({p,i,w:p.bankrupt?-Infinity:worth(i)})).sort((a,b)=>b.w-a.w);
  showModal(`<div class="dlg" role="dialog" aria-label="${title}"><h2>${title}</h2><ol class="rank">${order.map((r,n)=>`<li><span class="rk">${n+1}</span><span class="tok" style="--pc:${r.p.color}">${tokEmoji(r.p.token)}</span><b>${esc(r.p.name)}</b><span class="rw">${r.p.bankrupt?'Phá sản':money(r.w)}</span></li>`).join('')}</ol>
    <p class="hint">Tổng tài sản = tiền mặt + giá đất (đất cầm cố tính nửa giá) + giá nhà đã xây.</p>
    <div class="dlg-act">${S.phase==='gameover'?'<button class="btn primary" data-act="newgame">Ván mới</button>':''}<button class="btn" data-act="close-modal">Về bàn cờ</button></div></div>`);}
function confirmModal(title,text,act,label,danger){showModal(`<div class="dlg" role="dialog" aria-label="${title}"><h2>${title}</h2><p>${text}</p><div class="dlg-act"><button class="btn" data-act="close-modal">Hủy</button><button class="btn ${danger?'danger':'primary'}" data-act="${act}">${label}</button></div></div>`);}

function startGame(){const ps=draft.players.map((d,i)=>({name:d.name.trim()||`Người chơi ${i+1}`,token:d.token,color:d.color,money:draft.start,pos:0,jail:false,jt:0,cards:0,bankrupt:false}));
  S={players:ps,own:{},cur:0,phase:'roll',dbl:0,extra:false,dice:[3,4],log:[],pot:0,rules:{start:draft.start,salary:draft.salary,parking:draft.parking},msg:'',pending:null,debt:null,card:null,cred:null,turnNo:1,winner:null};
  log(`Ván mới trên bản đồ ${SK().name}. ${ps[0].name} đi trước.`,0);sel=null;busy=false;buildMode=false;view='game';pickOpen=null;render();save();window.scrollTo(0,0);}

function afterCustomize(){saveCfg();if(modalKind==='drawer')renderDrawer();if(view==='setup')renderSetup();else renderGame();renderTop();}

/* ================= events ================= */
const ACT={
  music:()=>{CFG.music=CFG.music===false;saveCfg();renderTop();},
  mute:()=>{CFG.mute=!CFG.mute;saveCfg();if(!CFG.mute)SFX.click();renderTop();},
  roll:doRoll,buy:doBuy,skip:doSkip,showbuy:showBuyCard,end:endTurn,
  payjail(){const p=cp();if(busy||S.phase!=='roll'||!p.jail||p.money<50)return;pay(p,null,50,'tax');p.jail=false;p.jt=0;log(`${p.name} nộp ${money(50)} để ra tù. Giờ đổ xúc xắc.`,S.cur);renderAll();save();},
  usecard(){const p=cp();if(busy||S.phase!=='roll'||!p.jail||!p.cards)return;p.cards--;p.jail=false;p.jt=0;log(`${p.name} dùng thẻ ra tù miễn phí.`,S.cur);renderAll();save();},
  paydebt(){const p=cp();if(S.phase!=='debt'||p.money<0)return;S.phase=S.debt.after;S.debt=null;log(`${p.name} đã xoay đủ tiền.`,S.cur);renderAll();save();},
  askbankrupt(){confirmModal('Tuyên bố phá sản?',`${esc(cp().name)} sẽ rời ván. ${S.debt&&S.debt.to!=null?`Toàn bộ đất chuyển cho ${esc(S.players[S.debt.to].name)}.`:'Toàn bộ đất trả về ngân hàng.'}`,'bankrupt','Phá sản',true);},
  bankrupt(){closeModal();if(S.phase==='debt')declareBankrupt();},
  tile(d){const i=+d.i;if(buildMode&&S.own[i]&&S.own[i].o===S.cur&&canBuild(i)){sel=i;manage('build',i);return;}
    sel=i;renderDynamic();renderDetail();if(landMq.matches){openSheet();$('.side').scrollTop=0;}else if(window.innerWidth<=940)$('#detail').scrollIntoView({behavior:'smooth',block:'nearest'});},
  menu(){openSheet();},'close-sheet':closeSheet,
  build(d){manage('build',+d.i);},sellh(d){manage('sellh',+d.i);},mort(d){manage('mort',+d.i);},unmort(d){manage('unmort',+d.i);},
  sellto(d){sellTo(+d.i);},
  buildmode(){if(busy||!S)return;buildMode=!buildMode;renderAll();},
  newgame(){closeModal();view='setup';pickOpen=null;render();window.scrollTo(0,0);},
  resume(){view='game';render();},
  endgame(){confirmModal('Kết thúc ván?','Người có tổng tài sản lớn nhất sẽ thắng. Không thể chơi tiếp sau khi kết thúc.','endgame-go','Kết thúc và xếp hạng');},
  'endgame-go'(){closeModal();if(!busy)finishByWorth();},
  rank(){showRanking(S.phase==='gameover'?'Kết quả':'Bảng xếp hạng');},
  'open-drawer'(){pickOpen=null;renderDrawer();},'close-modal':closeModal,
  addp(){if(draft.players.length>=6)return;const tk=Object.keys(TOK).find(id=>!draft.players.some(p=>p.token===id));const c=COLORS.find(c=>!draft.players.some(p=>p.color===c));
    draft.players.push({name:`Người chơi ${draft.players.length+1}`,token:tk,color:c});renderSetup();},
  remp(d){if(draft.players.length<=2)return;draft.players.splice(+d.k,1);pickOpen=null;renderSetup();},
  pick(d){pickOpen=pickOpen&&pickOpen.ctx===d.ctx&&pickOpen.k===+d.k?null:{ctx:d.ctx,k:+d.k};d.ctx==='setup'?renderSetup():renderDrawer();},
  tok(d){const list=d.ctx==='setup'?draft.players:S.players;list[+d.k].token=d.t;pickOpen=null;
    if(d.ctx==='setup')renderSetup();else{renderDrawer();renderAll();save();}},
  col(d){const list=d.ctx==='setup'?draft.players:S.players;list[+d.k].color=d.c;
    if(d.ctx==='setup')renderSetup();else{renderDrawer();renderAll();save();}},
  skin(d){CFG.skin=d.s;afterCustomize();},dice(d){CFG.dice=d.d;afterCustomize();},speed(d){CFG.speed=d.v;saveCfg();if(modalKind==='drawer')renderDrawer();if(view==='setup')renderSetup();},
  startm(d){draft.start=+d.v;renderSetup();},salary(d){draft.salary=+d.v;renderSetup();},
  startgame:startGame
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const a=el.dataset.act;if(a==='backdrop'){if(e.target===el&&modalKind!=='buy')closeModal();return;}
  const f=ACT[a];if(f)f(el.dataset);});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&modalKind){closeModal();return;}
  if(e.key==='Escape'&&document.body.classList.contains('sheet')){closeSheet();return;}
  const t=e.target;
  if((e.key==='Enter'||e.key===' ')&&t.classList&&t.classList.contains('tile')){e.preventDefault();ACT.tile(t.dataset);return;}
  if(e.key===' '&&view==='game'&&!modalKind&&!/INPUT|SELECT|TEXTAREA|BUTTON/.test(t.tagName)){const b=document.querySelector('#center .btn.primary');if(b&&!b.disabled){e.preventDefault();b.click();}}});
document.addEventListener('input',e=>{const t=e.target;if(!t.classList.contains('pname'))return;
  const list=t.dataset.ctx==='setup'?draft.players:S.players;list[+t.dataset.k].name=t.value;
  if(t.dataset.ctx==='drawer'){renderPlayers();renderCenter();save();}});
document.addEventListener('change',e=>{if(e.target.id==='opt-parking')draft.parking=e.target.checked;});

/* ================= boot ================= */
function start(data){const saved=loadAll();
  if(data&&data.S){S=data.S;view=data.view||'game';if(data.draft)draft=data.draft;if(data.CFG)Object.assign(CFG,data.CFG);}
  else if(saved){S=saved;view=S.phase==='gameover'?'setup':'game';}
  busy=false;if(S&&S.phase==='buy'&&S.pending==null)S.phase='end';
  render();}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>({S,CFG,view,draft}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>

</body>
</html>
