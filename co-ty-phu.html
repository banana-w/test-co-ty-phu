/* ================= online play (PeerJS) =================
   One device hosts the room and runs the rules; guests send action requests and mirror the host's state. */
const NET={mode:'local',peer:null,conns:{},code:'',cid:'',lobby:null,hostConn:null,started:false,syncT:0,status:''};
const PEER_PREFIX='cotyphu-v1-';
let REPLAY=false;
/* host: announce an effect so guests can play it too (state follows separately) */
function emit(type,data){if(NET.mode==='host'&&NET.started&&!REPLAY)broadcast({t:'ev',e:[type,data]});}
const GAME_ACTS=new Set(['roll','buy','skip','end','payjail','usecard','paydebt','bankrupt','build','sellh','mort','unmort','sellto','endgame-go']);
const OWNER_ACTS=new Set(['build','sellh','mort','unmort','sellto']);
function myCid(){if(NET.cid)return NET.cid;try{NET.cid=localStorage.getItem('ctp-cid')||'';}catch(e){}
  if(!NET.cid){NET.cid=Math.random().toString(36).slice(2,10);try{localStorage.setItem('ctp-cid',NET.cid);}catch(e){}}return NET.cid;}
const online=()=>NET.mode!=='local';
function mySeat(){return S&&S.players?S.players.findIndex(p=>p.cid===myCid()):-1;}
function myTurn(){return !online()||mySeat()===S.cur;}
function toast(msg,kind=''){let t=$('#toast');if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t);}
  t.className='toast '+kind;t.textContent=msg;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),3200);}
function loadPeer(){return window.Peer?Promise.resolve():new Promise((ok,no)=>{const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';s.onload=ok;s.onerror=()=>no(new Error('Không tải được thư viện kết nối. Kiểm tra mạng.'));document.head.appendChild(s);});}
function send(conn,msg){try{if(conn&&conn.open)conn.send(msg);}catch(e){}}
function broadcast(msg){Object.values(NET.conns).forEach(c=>send(c,msg));}
function setStatus(s){NET.status=s;const el=$('#net-status');if(el)el.textContent=s;}

/* ---------- host ---------- */
async function hostRoom(){setStatus('Đang tạo phòng…');renderOnline();
  try{await loadPeer();}catch(e){setStatus(e.message);renderOnline();return;}
  const tryOpen=n=>{const code=String(1000+Math.floor(Math.random()*9000));const peer=new Peer(PEER_PREFIX+code);
    peer.on('open',()=>{NET.mode='host';NET.peer=peer;NET.code=code;NET.started=false;
      const me=draft.players[0]||{name:'Chủ phòng',token:'tiger',color:COLORS[0]};
      NET.lobby={code,players:[{cid:myCid(),name:me.name,token:me.token,color:me.color,host:true,on:true}]};
      view='lobby';setStatus('');render();});
    peer.on('error',e=>{if(e.type==='unavailable-id'&&n<5){peer.destroy();tryOpen(n+1);return;}
      if(NET.mode==='host'&&e.type==='peer-unavailable')return;
      setStatus('Lỗi kết nối: '+(e.type||e.message));if(view!=='lobby'&&view!=='game')renderOnline();});
    peer.on('connection',c=>hostAccept(c));
    peer.on('disconnected',()=>{if(NET.mode==='host'){setStatus('Mất kết nối máy chủ trung gian, đang thử lại…');try{peer.reconnect();}catch(e){}}});};
  tryOpen(0);}
function hostAccept(c){c.on('data',m=>hostOnData(c,m));
  c.on('close',()=>{const cid=c._cid;if(!cid)return;delete NET.conns[cid];
    if(!NET.started){NET.lobby.players=NET.lobby.players.filter(p=>p.cid!==cid);lobbySync();}
    else{const k=S.players.findIndex(p=>p.cid===cid);if(k>=0)toast(`${S.players[k].name} mất kết nối.`,'warn');}});}
function freeToken(list,want){return want&&!list.some(p=>p.token===want)?want:Object.keys(TOK).find(id=>!list.some(p=>p.token===id));}
function freeColor(list,want){return want&&!list.some(p=>p.color===want)?want:COLORS.find(c=>!list.some(p=>p.color===c));}
function hostOnData(c,m){if(!m||typeof m!=='object')return;
  if(m.t==='hello'){const cid=String(m.cid||'').slice(0,20);if(!cid)return;c._cid=cid;
    if(NET.started){const k=S.players.findIndex(p=>p.cid===cid);
      if(k<0){send(c,{t:'err',msg:'Ván đã bắt đầu, không vào thêm được.'});setTimeout(()=>c.close(),300);return;}
      NET.conns[cid]=c;toast(`${S.players[k].name} đã vào lại.`);send(c,{t:'state',S,skin:CFG.skin,dice:CFG.dice});return;}
    const L=NET.lobby.players;let p=L.find(q=>q.cid===cid);
    if(!p){if(L.length>=6){send(c,{t:'err',msg:'Phòng đã đủ 6 người.'});setTimeout(()=>c.close(),300);return;}
      p={cid,name:String(m.name||'Khách').slice(0,16),token:freeToken(L,m.token),color:freeColor(L,m.color),on:true};L.push(p);}
    NET.conns[cid]=c;lobbySync();return;}
  if(!c._cid)return;
  if(m.t==='me'&&!NET.started){const L=NET.lobby.players,p=L.find(q=>q.cid===c._cid);if(!p)return;const others=L.filter(q=>q!==p);
    if(m.name!=null)p.name=String(m.name).slice(0,16);if(m.token)p.token=freeToken(others,m.token);if(m.color)p.color=freeColor(others,m.color);lobbySync();return;}
  if(m.t==='act'&&NET.started){const seat=S.players.findIndex(p=>p.cid===c._cid);const r=hostApply(seat,m.a,m.d||{});if(r)send(c,{t:'deny',msg:r});}}
function lobbySync(noRender){if(NET.mode!=="host")return;broadcast({t:"lobby",L:lobbyPayload()});if(view==="lobby"&&!noRender)renderLobby();}
function lobbyPayload(){return {code:NET.code,players:NET.lobby.players,skin:CFG.skin,dice:CFG.dice,
  rules:{start:draft.start,salary:draft.salary,parking:draft.parking,limit:draft.limit||0,dblBonus:!!draft.dblBonus}};}
function hostStart(){const L=NET.lobby.players;if(L.length<2){toast('Cần ít nhất 2 người chơi.','warn');return;}
  const ps=L.map(p=>({name:p.name.trim()||'Người chơi',token:p.token,color:p.color,cid:p.cid,money:draft.start,pos:0,jail:false,jt:0,cards:0,bankrupt:false}));
  S={players:ps,own:{},cur:0,phase:'roll',dbl:0,extra:false,dice:[3,4],log:[],pot:0,
    rules:{start:draft.start,salary:draft.salary,parking:draft.parking,limit:draft.limit||0,dblBonus:!!draft.dblBonus},t0:Date.now(),stats:newStats(ps.length),
    msg:'',pending:null,debt:null,card:null,cred:null,turnNo:1,winner:null,online:true};
  log(`Ván online trên bản đồ ${SK().name}. ${ps[0].name} đi trước.`,0);
  NET.started=true;sel=null;busy=false;buildMode=false;view='game';pickOpen=null;render();save();window.scrollTo(0,0);}
/* host runs an action for a seat; returns a reason string when refused */
function hostApply(seat,a,d){if(seat<0||!GAME_ACTS.has(a))return 'Không hợp lệ.';
  if(a==='endgame-go'){if(S.players[seat].cid!==myCid())return 'Chỉ chủ phòng được kết thúc ván.';}
  else if(OWNER_ACTS.has(a)){const o=S.own[+d.i];if(!o||o.o!==seat)return 'Đây không phải đất của bạn.';}
  else if(seat!==S.cur)return 'Chưa đến lượt bạn.';
  if(busy)return 'Đang chạy hiệu ứng, thử lại.';
  if(a==='sellto'){sellTo(+d.i,+d.b,+d.price);return '';}
  const f=ACT[a];if(f)f(d);return '';}
function queueSync(){if(NET.mode!=='host'||!NET.started)return;clearTimeout(NET.syncT);NET.syncT=setTimeout(()=>broadcast({t:'state',S,skin:CFG.skin,dice:CFG.dice}),40);}

/* ---------- guest ---------- */
async function joinRoom(code){code=String(code||'').replace(/\D/g,'').slice(0,4);if(code.length!==4){setStatus('Mã phòng gồm 4 chữ số.');renderOnline();return;}
  setStatus('Đang kết nối tới phòng '+code+'…');renderOnline();
  try{await loadPeer();}catch(e){setStatus(e.message);renderOnline();return;}
  const peer=new Peer();NET.peer=peer;
  peer.on('open',()=>{const c=peer.connect(PEER_PREFIX+code,{reliable:true});NET.hostConn=c;
    const to=setTimeout(()=>{if(!c.open){setStatus('Không kết nối được. Kiểm tra mã phòng, hoặc thử cùng Wi-Fi.');renderOnline();}},15000);
    c.on('open',()=>{clearTimeout(to);NET.mode='guest';NET.code=code;const me=draft.players[0]||{};
      send(c,{t:'hello',cid:myCid(),name:me.name||'Khách',token:me.token,color:me.color});});
    c.on('data',m=>guestOnData(m));
    c.on('close',()=>{if(NET.mode!=='guest')return;toast('Mất kết nối với chủ phòng.','warn');setStatus('Mất kết nối với chủ phòng.');
      if(view==='lobby'){leaveRoom(true);}});});
  peer.on('error',e=>{setStatus(e.type==='peer-unavailable'?'Không tìm thấy phòng '+code+'.':'Lỗi kết nối: '+(e.type||e.message));
    if(view!=='game'){NET.mode='local';renderOnline();}});}
function guestOnData(m){if(!m||typeof m!=='object')return;
  if(m.t==='err'){setStatus(m.msg);toast(m.msg,'warn');leaveRoom(true);return;}
  if(m.t==='deny'){toast(m.msg,'warn');return;}
  if(m.t==='lobby'){NET.lobby=m.L;if(m.L.skin&&CFG.skin!==m.L.skin)CFG.skin=m.L.skin;if(m.L.dice)CFG.dice=m.L.dice;
    if(view!=='lobby'){view='lobby';setStatus('');render();}else renderLobby();return;}
  if(m.t==='ev'){if(view==='game'&&S&&S.online){EVQ.push(m.e);playEvents();}return;}
  if(m.t==='state'){if(EVQ.length||EVQ.running){EVQ.pending=m;return;}applyState(m);}}
function applyState(m){const first=!S||!S.online||view!=='game';S=m.S;if(m.skin)CFG.skin=m.skin;if(m.dice)CFG.dice=m.dice;NET.started=true;
  if(first){view='game';busy=false;render();}else renderAll();
  if(S.phase==='buy'&&myTurn()&&modalKind!=='buy')showBuyCard();
  else if(modalKind==='buy'&&(S.phase!=='buy'||!myTurn()))closeModal();}
/* guest: replay the host's effects in order on the local copy, then take the host's snapshot */
const EVQ=[];
async function playEvents(){if(EVQ.running)return;EVQ.running=true;busy=true;renderCenter();
  while(EVQ.length){const [type,d]=EVQ.shift();REPLAY=true;
    try{await playEvent(type,d);}catch(e){console.warn('replay',type,e);}REPLAY=false;}
  EVQ.running=false;busy=false;const m=EVQ.pending;EVQ.pending=null;if(m)applyState(m);else renderAll();}
async function playEvent(type,d){
  switch(type){
    case 'dice':S.card=null;S.showSum=false;renderCenter();await animateDice(d);S.dice=d;S.showSum=true;break;
    case 'move':await moveSteps(S.players[d[0]],d[1]);break;
    case 'xfer':await xfer(d[0],d[1],d[2],d[3]||{});break;
    case 'card':await showCardFx(d[0],d[1],d[2]);break;
    case 'jail':goJail(S.players[d]);break;
    case 'buy':SFX.buy();S.own[d[0]]={o:d[1],lv:0,m:false};fxBought(d[0],d[2]);renderDynamic();break;
    case 'build':if(S.own[d[0]])S.own[d[0]].lv=d[1];fxBuilt(d[0],d[1]);break;
    case 'hit':shake();burstAt(tileEl(d));break;
    case 'win':confetti(140);SFX.win();break;}}
function guestMe(patch){if(NET.mode!=='guest')return;const me=NET.lobby&&NET.lobby.players.find(p=>p.cid===myCid());if(me)Object.assign(me,patch);
  send(NET.hostConn,Object.assign({t:'me'},patch));}

/* ---------- shared ---------- */
function netAct(a,d){if(a==='sellto'){d=Object.assign({},d,{b:$('#buyer')?$('#buyer').value:'',price:$('#sellprice')?$('#sellprice').value:''});}
  if(NET.mode==='host'){const r=hostApply(mySeat(),a,d);if(r)toast(r,'warn');}
  else send(NET.hostConn,{t:'act',a,d});}
function leaveRoom(silent){const was=NET.mode;try{NET.peer&&NET.peer.destroy();}catch(e){}
  Object.assign(NET,{mode:'local',peer:null,conns:{},code:'',lobby:null,hostConn:null,started:false});
  if(S&&S.online){S=null;try{S=loadAll();}catch(e){}}
  view='setup';if(!silent)setStatus('');render();window.scrollTo(0,0);}

/* ---------- views ---------- */
function renderOnline(){const el=$('#online');if(!el)return;
  el.innerHTML=`<div class="on-card"><div class="on-col"><h3>Tạo phòng</h3><p class="hint">Máy bạn làm chủ phòng, giữ luật chơi. Người khác nhập mã để vào.</p>
      <button class="btn primary" data-act="net-host">Tạo phòng mới</button></div>
    <div class="on-col"><h3>Vào phòng</h3><p class="hint">Nhập mã 4 số chủ phòng đưa cho bạn.</p>
      <div class="on-join"><input id="room-code" inputmode="numeric" maxlength="4" placeholder="0000" value="${esc(new URLSearchParams(location.search).get('room')||'')}" aria-label="Mã phòng"><button class="btn primary" data-act="net-join">Vào</button></div></div></div>
   <p class="hint on-st" id="net-status">${esc(NET.status)}</p>
   <p class="hint">Tên và nhân vật lấy từ <b>người chơi đầu tiên</b> trong danh sách bên dưới, đổi lại được trong phòng chờ.</p>`;}
function lobbyRow(p,editable){return `<div class="lb-row${p.cid===myCid()?' me':''}"><span class="tok" style="--pc:${p.color}">${tokEmoji(p.token)}</span>
  ${editable?`<input class="lb-name" id="lb-name" value="${esc(p.name)}" maxlength="16" aria-label="Tên của bạn">`:`<b>${esc(p.name)}</b>`}
  ${p.host?'<span class="tag">Chủ phòng</span>':''}${p.cid===myCid()?'<span class="tag me">Bạn</span>':''}</div>`;}
function renderLobby(){const L=NET.lobby;if(!L)return;const host=NET.mode==='host',me=L.players.find(p=>p.cid===myCid())||{};
  const others=L.players.filter(p=>p!==me),link=location.origin+location.pathname+'?room='+NET.code;
  const R=host?{start:draft.start,salary:draft.salary,parking:draft.parking,limit:draft.limit||0,dblBonus:!!draft.dblBonus}:L.rules||{};
  const ruleTxt=`Tiền khởi đầu ${money(R.start)} · Lương ${money(R.salary)}${R.limit?` · ${R.limit} phút`:''}${R.parking?' · Quỹ Bãi đỗ xe':''}${R.dblBonus?' · Thưởng đổ đôi':''}`;
  $('#main').innerHTML=`<div class="setup lobby">
   <header class="s-hero"><span class="lb-k">Phòng chờ</span><div class="lb-code" aria-label="Mã phòng">${NET.code.split('').map(c=>`<i>${c}</i>`).join('')}</div>
     <p>Đưa mã này cho bạn bè, hoặc gửi link: <button class="btn sm" data-act="net-copy" data-l="${esc(link)}">Sao chép link mời</button></p></header>
   <section><h2>Người chơi (${L.players.length}/6)</h2><div class="lb-list">${L.players.map(p=>lobbyRow(p,p.cid===myCid())).join('')}</div>
     <h3 class="lb-h">Nhân vật của bạn</h3><div class="pk-g lb-toks">${Object.values(TOK).map(t=>`<button class="pk-t${t.id===me.token?' on':''}" data-act="lb-tok" data-t="${t.id}" ${others.some(p=>p.token===t.id)?'disabled':''} title="${t.n}" aria-label="${t.n}">${t.e}</button>`).join('')}</div>
     <div class="swatches lb-cols">${COLORS.map(c=>`<button class="sw${c===me.color?' on':''}" style="--c:${c}" data-act="lb-col" data-c="${c}" ${others.some(p=>p.color===c)?'disabled':''} aria-label="Chọn màu"></button>`).join('')}</div></section>
   ${host?`<section><h2>Bản đồ</h2>${skinCards()}</section>
   <section><h2>Luật chơi</h2><div class="rules">
    <div class="rule"><span>Tiền khởi đầu</span>${seg('startm',[1000,1500,2000,3000].map(v=>[v,money(v)]),draft.start)}</div>
    <div class="rule"><span>Lương qua Xuất phát</span>${seg('salary',[100,200,300].map(v=>[v,money(v)]),draft.salary)}</div>
    <div class="rule"><span>Giới hạn thời gian</span>${seg('limit',[[0,'Không'],[20,'20 phút'],[30,'30 phút'],[45,'45 phút'],[60,'60 phút']],draft.limit||0)}</div>
    <div class="rule"><span>Quỹ Bãi đỗ xe</span><label class="switch"><input type="checkbox" id="opt-parking" ${draft.parking?'checked':''}> Thuế và phạt dồn vào quỹ</label></div>
    <div class="rule"><span>Thưởng đổ đôi</span><label class="switch"><input type="checkbox" id="opt-dbl" ${draft.dblBonus?'checked':''}> Đổ đôi nhận thêm ${money(50)}</label></div>
   </div></section>`:`<section><h2>Bản đồ và luật</h2><p class="lb-info"><b>${SK().name}</b> · ${ruleTxt}</p><p class="hint">Chủ phòng chọn bản đồ và luật.</p></section>`}
   <div class="s-go">${host?`<button class="btn primary xl" data-act="net-start" ${L.players.length<2?'disabled':''}>${L.players.length<2?'Chờ thêm người…':'Bắt đầu ván'}</button>`:'<p class="hint">Chờ chủ phòng bắt đầu…</p>'}
     <button class="btn" data-act="net-leave">Rời phòng</button></div></div>`;}
function setMe(patch){if(NET.mode==="host"){const me=NET.lobby.players.find(p=>p.cid===myCid());Object.assign(me,patch);lobbySync("name" in patch);}
  else{guestMe(patch);if(!('name' in patch))renderLobby();}}
Object.assign(ACT,{
  'net-host'(){hostRoom();},
  'net-join'(){joinRoom(($('#room-code')||{}).value);},
  'net-start'(){hostStart();},
  'net-leave'(){confirmModal('Rời phòng?',NET.mode==='host'?'Phòng sẽ đóng với mọi người.':'Bạn sẽ rời khỏi phòng này.','net-leave-go','Rời phòng',true);},
  'net-leave-go'(){closeModal();leaveRoom();},
  'net-copy'(d){const done=()=>toast('Đã sao chép link mời.');try{navigator.clipboard.writeText(d.l).then(done,()=>prompt('Sao chép link:',d.l));}catch(e){prompt('Sao chép link:',d.l);}},
  'lb-tok'(d){setMe({token:d.t});},'lb-col'(d){setMe({color:d.c});}
});
document.addEventListener('input',e=>{if(e.target.id==='lb-name')setMe({name:e.target.value});});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='room-code')ACT['net-join']();});
function start(data){const saved=loadAll();
  if(data&&data.S){S=data.S;view=data.view||'game';if(data.draft)draft=data.draft;if(data.CFG)Object.assign(CFG,data.CFG);}
  else if(saved){S=saved;view=S.phase==='gameover'?'setup':'game';}
  busy=false;if(S&&S.phase==='buy'&&S.pending==null)S.phase='end';
  render();}
if(window.claude?.hot?.snapshot)window.claude.hot.snapshot(()=>({S,CFG,view,draft}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
</script>
