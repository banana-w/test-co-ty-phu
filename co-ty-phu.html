<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#E6ECE8">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Cờ Tỷ Phú</title>
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="shortcut icon" href="favicon.ico">
<meta name="apple-mobile-web-app-title" content="Cờ Tỷ Phú">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Layout: the board is the hero (square, left); a ledger of players, title deed and log sits right, stacking under the board on phones */
:root{
  --bg:#E6ECE8; --surface:#F8FBF9; --ink:#17201C; --muted:#56655F; --line:#C8D3CE;
  --accent:#B3261E; --accent-ink:#FFF7F3; --danger:#B42318;
  --f-display:"Baloo 2","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1513; --surface:#17201D; --ink:#E3EBE7; --muted:#93A39D; --line:#2B3733;
  --accent:#E8594D; --accent-ink:#1C0705; --danger:#F97066; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1513; --surface:#17201D; --ink:#E3EBE7; --muted:#93A39D; --line:#2B3733;
  --accent:#E8594D; --accent-ink:#1C0705; --danger:#F97066; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- header ---------- */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font:800 26px/1 var(--f-display);letter-spacing:-.01em}
.brand .die{width:28px}
.top nav{display:flex;gap:6px;flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{font:600 14px/1.1 var(--f-body);padding:.66em 1.1em;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .08s ease,background .15s}
.btn:hover:not(:disabled){transform:translateY(-1px)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.42;cursor:not-allowed}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.ghost{background:transparent}
.btn.sm{font-size:13px;padding:.5em .8em}
.btn.xl{font:800 22px/1 var(--f-display);padding:.6em 1.6em;border-radius:12px}

/* ---------- game layout ---------- */
.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;max-width:1260px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 36px;align-items:start}
.board-wrap{width:min(100%,max(540px,calc(100dvh - 92px)));min-width:0;justify-self:center}
@media (max-width:940px){.layout{grid-template-columns:minmax(0,1fr)}.board-wrap{width:100%;max-width:680px}.side{max-width:680px;width:100%;justify-self:center}}

.board{aspect-ratio:1;width:100%;container-type:inline-size;display:grid;
  grid-template-columns:1.6fr repeat(9,1fr) 1.6fr;grid-template-rows:1.6fr repeat(9,1fr) 1.6fr;
  gap:1px;background:var(--b-line);border:2px solid var(--b-line);border-radius:8px;overflow:hidden;
  box-shadow:0 18px 40px -22px rgba(0,0,0,.55),0 2px 0 rgba(0,0,0,.08)}
.tile{background:var(--b-bg);color:var(--b-ink);position:relative;display:flex;min-width:0;min-height:0;overflow:hidden;cursor:pointer;transition:filter .15s}
.tile:hover{filter:brightness(1.05) saturate(1.05)}
.tile.sel{box-shadow:inset 0 0 0 max(2px,.35cqi) var(--b-accent)}
.side-b{flex-direction:column}.side-t{flex-direction:column-reverse}
.side-l{flex-direction:row-reverse}.side-r{flex-direction:row}
.band{flex:0 0 22%;display:flex;align-items:center;justify-content:center}
.houses{display:flex;gap:.2cqi;align-items:flex-end;justify-content:center;filter:drop-shadow(0 0 1px rgba(255,255,255,.95)) drop-shadow(0 1px 0 rgba(0,0,0,.55))}
.side-l .houses,.side-r .houses{flex-direction:column;align-items:center}
.house{display:block;width:1.6cqi;height:1.8cqi;min-width:6px;min-height:7px;
  background:linear-gradient(#17683A 0 42%,#3BBE71 42%);clip-path:polygon(50% 0,100% 42%,100% 100%,0 100%,0 42%)}
.hotel{display:block;width:4.6cqi;height:2.3cqi;min-width:16px;min-height:8px;
  background:repeating-linear-gradient(90deg,transparent 0 12%,#FFE39A 12% 22%) 0 70%/100% 26% no-repeat,linear-gradient(#8E1B14 0 32%,#DE3B2F 32%);
  clip-path:polygon(0 32%,50% 0,100% 32%,100% 100%,0 100%)}
.side-l .hotel,.side-r .hotel{width:2.4cqi;height:3.8cqi;min-width:9px;min-height:14px}
.house.drop,.hotel.drop{animation:drop .6s cubic-bezier(.3,1.5,.5,1)}
@keyframes drop{0%{transform:translateY(-320%) scale(.5);opacity:0}45%{opacity:1}100%{transform:none}}
.tile.thud{animation:thud .5s ease-out}
@keyframes thud{25%{filter:brightness(1.25)}}
.tile.can-build{box-shadow:inset 0 0 0 max(2px,.4cqi) #F5C542;animation:glow 1.2s ease-in-out infinite;z-index:1}
@keyframes glow{50%{box-shadow:inset 0 0 0 max(3px,.6cqi) #F5C542,inset 0 0 2.4cqi rgba(245,197,66,.55)}}
.tile.dim{filter:saturate(.3) brightness(.9);opacity:.75}
.bb{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;white-space:nowrap;pointer-events:none;
  font:800 max(9px,1.3cqi)/1 var(--f-display);background:#F5C542;color:#3A2600;padding:.35cqi .55cqi;border-radius:.6cqi;box-shadow:0 2px 0 #B7861A}
.tprice.rent{opacity:1;background:var(--oc);color:var(--oi);font-weight:700;border-radius:.45cqi;padding:.1cqi .45cqi}
.tprice.mortl{font-style:italic}
.tile.bought .own{animation:ownIn .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes ownIn{from{transform:scale(0)}}
.tinfo{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:.3cqi;padding:.55cqi .35cqi;text-align:center;min-width:0;min-height:0}
.tname{font-size:1.25cqi;line-height:1.08;font-weight:600;overflow-wrap:anywhere;text-wrap:balance}
.tprice{font-size:1.15cqi;font-variant-numeric:tabular-nums;opacity:.78;white-space:nowrap}
.ticon{display:block;width:3.2cqi;height:3.2cqi;color:var(--b-accent)}
.ticon svg{width:100%;height:100%;fill:currentColor;display:block}
.side-l .ticon,.side-r .ticon{width:2.5cqi;height:2.5cqi}
.tart{display:block;flex:none;width:4.4cqi;height:4.4cqi;color:color-mix(in srgb,var(--tc,var(--b-ink)) 78%,var(--b-ink));opacity:.92}
.tart svg{display:block;width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.side-l .tart,.side-r .tart{width:3.6cqi;height:3.6cqi}
.tile.owned-t .tart{opacity:1}
.t-station .ticon,.t-util .ticon{color:var(--b-ink)}
.own{position:absolute;background:transparent}
.side-b .own{left:0;right:0;bottom:0;height:.75cqi}
.side-t .own{left:0;right:0;top:0;height:.75cqi}
.side-l .own{top:0;bottom:0;left:0;width:.75cqi}
.side-r .own{top:0;bottom:0;right:0;width:.75cqi}
.tile.mort .tinfo,.tile.mort .band{opacity:.4}
.tile.mort::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(135deg,transparent 0 .8cqi,color-mix(in srgb,var(--b-ink) 14%,transparent) .8cqi 1.05cqi)}
.corner{flex-direction:column;align-items:center;justify-content:center;gap:.4cqi;text-align:center;padding:.8cqi}
.corner .ticon{width:4.6cqi;height:4.6cqi}
.corner .cl{font:800 1.75cqi/1 var(--f-display);text-transform:uppercase;letter-spacing:.02em}
.corner .cs{font-size:1.15cqi;opacity:.75}
.c-jail .ticon svg,.c-park .ticon svg{fill:none;stroke:currentColor;stroke-width:2}
.corner .toks{align-content:flex-start;justify-content:flex-start}
.toks{position:absolute;inset:0;overflow:visible;display:flex;flex-wrap:wrap;align-items:center;align-content:center;justify-content:center;gap:1px;pointer-events:none;padding:2px}
@container (max-width:560px){
  .tname,.corner .cs{display:none}
  .tart{width:5cqi;height:5cqi}
  .tinfo{justify-content:center}
  .tprice{font-size:max(7px,1.5cqi)}
  .corner .cl{font-size:max(7px,1.9cqi)}
}

/* tokens */
.tok{--sz:max(15px,3.2cqi);width:var(--sz);height:var(--sz);border-radius:50%;background:var(--pc);display:inline-grid;place-items:center;
  font-size:calc(var(--sz)*.6);line-height:1;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.4);flex:none;position:relative}
.toks .tok.cur{--sz:max(24px,5cqi);z-index:2;animation:bob 1.1s ease-in-out infinite;box-shadow:0 0 0 3px #F5C542,0 0 12px 3px rgba(245,197,66,.8),0 3px 8px rgba(0,0,0,.5)}
.toks .tok.jailed{border-style:dashed;filter:saturate(.6)}
@keyframes bob{50%{transform:translateY(-16%)}}

/* center of board */
.center{grid-row:2/11;grid-column:2/11;background:var(--b-center);color:var(--b-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:max(6px,1.5cqi);padding:max(8px,2.2cqi);text-align:center;position:relative;overflow:hidden;min-width:0;min-height:0}
.c-title{display:grid;gap:.4cqi;justify-items:center}
.c-kicker{font:700 max(9px,1.2cqi)/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;opacity:.65}
.c-name{font:800 max(22px,6cqi)/.92 var(--f-display);color:var(--b-accent);letter-spacing:-.01em;text-wrap:balance}
.c-turn{display:flex;align-items:center;gap:max(8px,1.2cqi);background:var(--b-bg);padding:max(4px,.7cqi) max(12px,1.8cqi) max(4px,.7cqi) max(4px,.7cqi);border-radius:999px;border:1px solid var(--b-line)}
.c-turn .tok{--sz:max(28px,4.4cqi)}
.c-who{display:grid;text-align:left;line-height:1.15}
.c-who b{font-size:max(13px,1.9cqi)}
.c-who span{font-size:max(12px,1.6cqi);font-variant-numeric:tabular-nums;opacity:.85}
.tag{font:700 max(10px,1.3cqi)/1 var(--f-body);text-transform:uppercase;letter-spacing:.08em;padding:.35em .6em;border-radius:5px;background:var(--b-ink);color:var(--b-bg)}
.c-msg{margin:0;font-size:max(12px,1.7cqi);max-width:58cqi;line-height:1.35;min-height:2.7em;text-wrap:balance}
.c-warn{margin:0;font-size:max(12px,1.6cqi);font-weight:700;max-width:58cqi}
.card-pop{background:var(--b-bg);border:2px solid var(--b-accent);border-radius:10px;padding:max(8px,1.3cqi) max(12px,2cqi);max-width:min(100%,58cqi);animation:pop .28s ease-out;box-shadow:0 4px 0 color-mix(in srgb,var(--b-accent) 30%,transparent)}
.card-k{font:800 max(12px,1.6cqi)/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--b-accent)}
.card-pop p{margin:.35em 0 0;font-size:max(12px,1.7cqi);line-height:1.35}
.cardfx{position:fixed;inset:0;z-index:60;display:grid;place-items:center;pointer-events:none;background:rgba(8,12,10,.35);animation:fade .2s ease-out;perspective:900px}
.cardfx.out{animation:fxout .3s ease-in forwards}
@keyframes fxout{to{opacity:0}}
.cf-card{width:min(260px,60vw,52vh);aspect-ratio:5/7;position:relative;transform-style:preserve-3d;animation:cfin .9s cubic-bezier(.3,1.3,.5,1) forwards}
@keyframes cfin{0%{transform:translateY(60vh) rotateY(0) scale(.5)}45%{transform:translateY(0) rotateY(0) scale(1)}100%{transform:rotateY(180deg)}}
.cf-face{position:absolute;inset:0;border-radius:14px;backface-visibility:hidden;display:grid;place-items:center;text-align:center;box-shadow:0 18px 40px -10px rgba(0,0,0,.6);border:3px solid #fff}
.cf-back{background:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 10px,transparent 10px 20px),var(--cfc);color:#fff}
.cf-back svg{width:45%;height:45%;fill:currentColor}
.cf-front{transform:rotateY(180deg);background:#FFFBEF;color:#2A2118;align-content:center;gap:10px;padding:16px;border-color:var(--cfc)}
.cf-front .ck{font:800 clamp(14px,4vh,20px)/1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--cfc)}
.cf-front .ci{width:44px;height:44px;color:var(--cfc);margin:0 auto}.cf-front .ci svg{width:100%;height:100%;fill:currentColor}
.cf-front p{margin:0;font-size:clamp(13px,3.6vh,16px);line-height:1.35}

@keyframes pop{from{transform:scale(.85) rotate(-2deg);opacity:0}}
.c-actions{display:flex;gap:max(6px,1.1cqi);flex-wrap:wrap;justify-content:center}
.center .btn{font-size:max(13px,1.75cqi);background:var(--b-bg);color:var(--b-ink);border-color:var(--b-line)}
.center .btn.primary{background:var(--b-accent);border-color:var(--b-accent);color:var(--b-accent-ink);box-shadow:0 3px 0 color-mix(in srgb,var(--b-accent) 55%,#000)}
.center .btn.danger{color:#D93A3A;border-color:#D93A3A;background:transparent}

/* dice */
.dice-row{display:flex;gap:max(8px,2cqi);justify-content:center}
.die{width:max(38px,8.4cqi);aspect-ratio:1;border-radius:20%;display:block;padding:0;box-sizing:border-box;
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 3px 8px rgba(0,0,0,.25);flex:none}
.die svg{display:block;width:100%;height:100%;overflow:visible}
.pip.on{fill:var(--pip)}
.die.digit{display:grid;place-items:center;grid-template:none;padding:0}
.die.digit b{font:800 calc(1em + 0px) var(--f-display);font-size:inherit}
.dice-row .die.digit{font-size:max(24px,5.4cqi)}
.dice-row.rolling .die{animation:shake .14s linear infinite}
.dice-row.landed .die{animation:land .3s ease-out}
.dsum{align-self:center;font:800 max(20px,4.6cqi)/1 var(--f-display);color:var(--b-accent);animation:sumpop .45s cubic-bezier(.3,1.6,.5,1);white-space:nowrap}
@keyframes sumpop{from{transform:scale(0);opacity:0}}
.tile.dest{z-index:2;animation:destblink .5s ease-in-out infinite alternate}
@keyframes destblink{from{box-shadow:inset 0 0 0 max(2px,.35cqi) #F5C542}to{box-shadow:inset 0 0 0 max(4px,.7cqi) #F5C542,inset 0 0 3cqi rgba(245,197,66,.85);filter:brightness(1.15)}}
@keyframes shake{25%{transform:rotate(-14deg) translateY(-8%)}75%{transform:rotate(12deg) translateY(4%)}}
@keyframes land{40%{transform:scale(1.12)}}
[data-dice="classic"] .die{background:#FBFAF6;--pip:#1B1B1B;color:#1B1B1B;border:1px solid #D3CFC4}
[data-dice="lucky"] .die{background:linear-gradient(145deg,#DA2A30,#A0101A);--pip:#F7D774;color:#F7D774;border:1px solid #7E0D13}
[data-dice="jade"] .die{background:linear-gradient(145deg,#86D0B7,#3C9075);--pip:#F4FFF9;color:#F4FFF9;border:1px solid #2F725D}
[data-dice="wood"] .die{background:linear-gradient(145deg,#E0B37A,#AF7A42);--pip:#3A2210;color:#3A2210;border:1px solid #87592C}
[data-dice="neon"] .die{background:#0C0E1B;--pip:#39FFB0;color:#39FFB0;border:1.5px solid #39FFB0;box-shadow:0 0 12px rgba(57,255,176,.45)}
[data-dice="neon"] .pip.on{filter:drop-shadow(0 0 2px #39FFB0)}
[data-dice="digit"] .die{background:#FBFAF6;color:#1B1B1B;border:1px solid #D3CFC4}

/* ---------- side ledger ---------- */
.side{display:grid;gap:14px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel h3{margin:0 0 10px;font:700 11.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px}
.ph h3{margin:0}
.plist{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.plist li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:9px}
.plist li.cur{background:color-mix(in srgb,var(--accent) 9%,var(--surface));box-shadow:inset 0 0 0 1.5px color-mix(in srgb,var(--accent) 45%,transparent)}
.plist li.out{opacity:.45}
.plist li.out b{text-decoration:line-through}
.plist .tok,.rank .tok{--sz:32px}
.pmeta{min-width:0;display:grid}
.pmeta b{font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pstat{font-size:12px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
.chips i{width:8px;height:11px;border-radius:2px;display:block}
.chips i.m{opacity:.3}
.pmoney{font:700 16px/1 var(--f-body);font-variant-numeric:tabular-nums}
.pmoney.neg{color:var(--danger)}
.pot{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:13px;color:var(--muted)}
.pot b{color:var(--ink);font-variant-numeric:tabular-nums}
.hint{color:var(--muted);font-size:13px;margin:0}
.deed{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.deed-head{padding:10px 12px;display:grid;gap:3px;text-align:center}
.deed-head span{font:700 10.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}
.deed-head b{font:800 23px/1.05 var(--f-display)}
.buydlg{max-width:340px;gap:12px;animation:pop .3s cubic-bezier(.3,1.4,.5,1)}
.buydlg .deed{box-shadow:0 10px 24px -12px rgba(0,0,0,.45)}
.buy-k{margin:0;text-align:center;font:700 13px/1 var(--f-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.buy-m{margin:0;text-align:center;font-size:13px;color:var(--muted)}
.buydlg .dlg-act .btn{flex:1}
.buydlg .dnote{display:none}
@media (orientation:landscape) and (max-height:540px){.buydlg{padding:12px;gap:8px;max-width:320px}.buydlg .deed table{font-size:11.5px}.buydlg .deed td{padding:2px 10px}}
.deed table{width:100%;border-collapse:collapse;font-size:13px}
.deed td{padding:4px 12px}
.deed td:last-child{text-align:right;font-variant-numeric:tabular-nums;font-weight:600}
.deed tr.hl td{background:color-mix(in srgb,var(--accent) 12%,transparent);font-weight:700}
.deed tr.sep td{border-top:1px solid var(--line)}
.deed .dnote{padding:8px 12px;font-size:13px;color:var(--muted);border-top:1px solid var(--line)}
.owner{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:13px}
.owner .tok{--sz:22px;border-width:1.5px}
.manage{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.sellto{display:grid;gap:6px;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.sellto label{font-size:12px;color:var(--muted)}
.sellto .row{display:flex;gap:6px;flex-wrap:wrap}
.sellto select,.sellto input{font:500 14px var(--f-body);padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0}
.sellto input{width:100px}
.log{list-style:none;margin:0;padding:0;max-height:260px;overflow:auto;display:grid;gap:7px;font-size:13px}
.log li{display:grid;grid-template-columns:8px minmax(0,1fr);gap:8px;align-items:baseline}
.log li i{width:8px;height:8px;border-radius:50%;display:block;background:var(--muted)}
.log li:first-child{font-weight:600}

/* ---------- setup ---------- */
.setup{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 56px;display:grid;gap:30px}
.s-hero{display:grid;gap:12px;padding-top:12px}
.s-hero h1{margin:0;font:800 clamp(46px,9vw,92px)/.86 var(--f-display);letter-spacing:-.02em;text-wrap:balance}
.s-hero h1 em{font-style:normal;color:var(--accent)}
.s-strip{display:flex;height:12px;border-radius:3px;overflow:hidden;max-width:420px}
.setup>*,.s-hero>*{min-width:0}
.s-strip i{flex:1}
.s-hero p{margin:0;max-width:60ch;font-size:16px;color:var(--muted)}
.s-hero .row{display:flex;gap:8px;flex-wrap:wrap}
.setup section{display:grid;gap:12px}
.setup h2{margin:0;font:800 26px/1 var(--f-display)}
.s-h{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.s-go{display:flex;justify-content:center;padding-top:6px}

.peditor{display:grid;gap:8px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.prow.out{opacity:.5}
.tokbtn{background:none;border:0;padding:2px;cursor:pointer;border-radius:50%}
.tokbtn .tok{--sz:42px}
.pname{font:600 15px var(--f-body);padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);min-width:0;width:100%}
.swatches{display:flex;gap:5px;flex-wrap:wrap}
.sw{width:24px;height:24px;border-radius:50%;background:var(--c);border:0;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--c)}
.sw:disabled{opacity:.18;cursor:not-allowed}
.x{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;cursor:pointer}
.picker{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;margin-top:-4px}
.pk{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;align-items:center}
.pk-n{font:700 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.pk-g{display:flex;flex-wrap:wrap;gap:4px}
.pk-t{width:40px;height:40px;font-size:22px;line-height:1;border-radius:9px;border:2px solid transparent;background:var(--surface);cursor:pointer;padding:0}
.pk-t.on{border-color:var(--accent)}
.pk-t:disabled{opacity:.22;cursor:not-allowed}
@media (max-width:600px){.prow{grid-template-columns:auto minmax(0,1fr) auto}.swatches{grid-column:1/-1;order:5}.pk{grid-template-columns:1fr}}

.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.skin{text-align:left;border:2px solid var(--line);border-radius:14px;padding:6px;background:var(--surface);cursor:pointer;display:grid;gap:6px;color:var(--ink)}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.sk-board{background:var(--b-bg);color:var(--b-ink);border-radius:9px;padding:12px;display:grid;gap:7px;border:1px solid var(--b-line)}
.sk-chips{display:flex;gap:3px}
.sk-chips i{flex:1;height:10px;border-radius:2px}
.sk-name{font:800 24px/1 var(--f-display);color:var(--b-accent)}
.sk-sample{font-size:12px;opacity:.8}
.sk-sub{font-size:12.5px;color:var(--muted);padding:0 6px 4px}
.dopts{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:10px}
.dopt{border:2px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);cursor:pointer;display:grid;justify-items:center;gap:10px;padding:14px 8px 10px;font:600 13px var(--f-body)}
.dopt.on{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.dice-row.sm .die{width:40px}
.dice-row.sm .die.digit{font-size:24px}
.brand .die.digit{font-size:17px}
.rules{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px}
.rule{display:grid;grid-template-columns:210px minmax(0,1fr);gap:12px;align-items:center}
.rule > span{font-weight:600}
.rule small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
@media (max-width:600px){.rule{grid-template-columns:1fr;gap:6px}}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;background:var(--bg);padding:4px;border-radius:10px;border:1px solid var(--line);justify-self:start}
.seg button{border:0;background:transparent;padding:8px 12px;border-radius:7px;font:600 14px var(--f-body);color:var(--muted);cursor:pointer;font-variant-numeric:tabular-nums}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;justify-self:start}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* ---------- modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,12,10,.58);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .15s ease-out}
@keyframes fade{from{opacity:0}}
.dlg{background:var(--surface);color:var(--ink);border-radius:16px;max-width:520px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;padding:22px;border:1px solid var(--line);box-shadow:0 24px 60px -20px rgba(0,0,0,.5);display:grid;gap:16px}
.dlg.wide{max-width:780px}
.dlg h2{margin:0;font:800 28px/1 var(--f-display)}
.dlg h3{margin:0 0 8px;font:700 11.5px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.dlg p{margin:0}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.dlg-act{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.rank{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.rank li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--bg)}
.rank li:first-child{background:color-mix(in srgb,var(--accent) 12%,var(--bg))}
.rank .rk{font:800 20px/1 var(--f-display);color:var(--muted);text-align:center}
.rank li:first-child .rk{color:var(--accent)}
.rank b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank .rw{font-weight:700;font-variant-numeric:tabular-nums}


/* ---------- phone landscape (iPhone 17: 874×402): the board fills the screen; players sit in the board centre; deed, log and menu slide in from the right ---------- */
.mini,.cpl,.x-sheet{display:none}
.c-msgs{display:grid;gap:max(6px,1.2cqi);justify-items:center}
@media (orientation:landscape) and (max-height:540px){
  :root{--h:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
    --gut-l:max(8px,env(safe-area-inset-left,0px));--gut-r:max(8px,env(safe-area-inset-right,0px))}
  body[data-view="game"]{overflow:hidden}
  body[data-view="game"] .top{display:none}
  .layout{display:block;max-width:none;height:var(--h);padding-left:var(--gut-l);padding-right:var(--gut-r);padding-block:4px}
  .board-wrap{width:100%;height:100%;max-width:none}
  .board{width:100%;height:100%;aspect-ratio:auto;container-type:size;border-radius:6px;border-width:1.5px}

  /* tiles in fixed px so they stay legible on a short, wide board */
  .tinfo{padding:2px 2px 3px;gap:1px}
  .tname{display:block;font-size:8.5px;line-height:1.08}
  .tprice{font-size:8.5px}
  .tinfo{justify-content:space-between}
  .side-l .tinfo,.side-r .tinfo{justify-content:center;gap:0}
  .side-l .tname,.side-r .tname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .ticon{width:13px;height:13px}
  .side-l .tinfo,.side-r .tinfo{display:grid;grid-template-columns:auto minmax(0,auto);justify-content:center;align-content:center;column-gap:4px;justify-items:center}
  .side-l .tname,.side-r .tname{grid-column:2;grid-row:1}
  .side-l .tprice,.side-r .tprice{grid-column:2;grid-row:2}
  .side-l .tprice:empty,.side-r .tprice:empty{display:none}
  .side-l .ticon,.side-r .ticon{display:block;grid-column:1;grid-row:1/3;width:13px;height:13px}
  .side-l .tart,.side-r .tart{grid-column:1;grid-row:1/3;width:17px;height:17px}
  .side-t .tart,.side-b .tart{width:13px;height:13px}
  .side-t .tinfo:has(.tart),.side-b .tinfo:has(.tart){gap:1px}
  .side-t .tinfo:has(.tart) .tname,.side-b .tinfo:has(.tart) .tname{display:block;flex:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
  .side-t .tinfo:has(.tart) .tprice,.side-b .tinfo:has(.tart) .tprice{flex:none}
  .corner{gap:2px;padding:3px}
  .corner .ticon{display:block;width:18px;height:18px}
  .corner .cl{font-size:10px}
  .corner .cs{display:none}
  .side-b .band,.side-t .band{flex-basis:10px}
  .side-l .band,.side-r .band{flex-basis:10px}
  .side-t .tinfo,.side-b .tinfo{justify-content:center;gap:2px}
  .side-t .tname,.side-b .tname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .side-t .tinfo:has(.tprice:not(:empty)) .ticon,.side-b .tinfo:has(.tprice:not(:empty)) .ticon{display:none}
  .side-b .own,.side-t .own{height:3px}
  .side-l .own,.side-r .own{width:3px}
  .houses{gap:1px}
  .house{width:7px;height:8px;min-width:0;min-height:0}
  .hotel{width:18px;height:9px;min-width:0;min-height:0}
  .side-l .houses,.side-r .houses{display:grid;grid-template-columns:repeat(2,7px);justify-content:center}
  .side-l .hotel,.side-r .hotel{width:10px;height:15px;min-width:0;min-height:0;grid-column:1/-1}
  .tok{--sz:18px;border-width:1.5px}
  .toks .tok.cur{--sz:28px}
  .toks{gap:0}
  .bb{font-size:8.5px;padding:2px 4px;border-radius:4px}
  .tprice.rent{padding:0 3px;border-radius:3px}

  /* board centre: players on the left, turn / dice / message / actions on the right */
  .center{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);
    grid-template-areas:"pl turn" "pl dice" "pl msg" "pl act";grid-template-rows:auto auto minmax(0,1fr) auto;
    align-items:center;justify-items:center;gap:6px 14px;padding:8px 10px}
  .c-title{display:none}
  .c-turn{grid-area:turn;padding:3px 12px 3px 3px}
  .c-turn .tok{--sz:24px}
  .c-who b{font-size:13px}
  .c-who span{font-size:12px}
  #dice{grid-area:dice}
  .dice-row .die{width:44px}
  .dice-row .die.digit{font-size:22px}
  .c-msgs{grid-area:msg;gap:4px;max-width:100%;min-height:0;overflow:auto}
  .c-msg{font-size:12px;min-height:0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .c-warn{font-size:11.5px}
  .card-pop{padding:5px 10px;max-width:100%}
  .card-pop p{font-size:12px}
  .card-k{font-size:11px}
  .c-actions{grid-area:act;gap:5px}
  .center .btn{font-size:13px;padding:.55em .9em}
  .center .btn.sm{font-size:11.5px;padding:.4em .7em;box-shadow:none}

  .cpl{grid-area:pl;display:flex;flex-direction:column;gap:2px;align-self:stretch;justify-self:stretch;min-height:0;overflow:auto;
    background:var(--b-bg);border:1px solid var(--b-line);border-radius:8px;padding:6px}
  .cpl-h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:2px}
  .cpl-h span{font:700 9.5px/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;opacity:.75}
  .cpl-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:6px;align-items:center;padding:3px 5px;border-radius:6px;font-size:12px;text-align:left}
  .cpl-row .tok{--sz:20px}
  .cpl-row b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cpl-row .tag{font-size:8.5px;padding:.25em .4em;margin-left:4px;vertical-align:1px}
  .cpl-row [data-mp]{font-weight:700;font-variant-numeric:tabular-nums}
  .cpl-row .neg{color:#D93A3A}
  .cpl-row.cur{background:color-mix(in srgb,var(--b-accent) 16%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--b-accent) 45%,transparent)}
  .cpl-row.out{opacity:.4}
  .cpl-row.out b{text-decoration:line-through}
  .cpl-row.hit-neg{animation:hitNeg .7s ease-out}
  .cpl-row.hit-pos{animation:hitPos .7s ease-out}
  .side-l .toks{justify-content:flex-start;padding-left:3px}
  .side-r .toks{justify-content:flex-end;padding-right:3px}
  .mini{order:-2}
  .side #detail{order:-1}
  .cpl-pot{font-size:11px;opacity:.8;margin-top:auto;padding:3px 5px 0}

  /* the ledger becomes a drawer */
  .side{position:fixed;top:0;right:0;bottom:0;width:min(360px,52vw);max-width:none;z-index:30;margin:0;
    background:var(--bg);box-shadow:-14px 0 34px rgba(0,0,0,.28);overflow-y:auto;overscroll-behavior:contain;
    padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 10px) 10px;
    display:grid;gap:8px;align-content:start;
    transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s linear .22s}
  body.sheet .side{transform:none;visibility:visible;transition:transform .22s ease}
  .mini{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap;position:sticky;top:-8px;z-index:2;background:var(--bg);padding-block:2px 6px}
  .mini-name{font:800 18px/1 var(--f-display);color:var(--accent)}
  .mini nav{display:flex;gap:4px;flex-wrap:wrap}
  .mini .btn{font-size:12px;padding:.45em .65em;border-radius:7px}
  .x-sheet{display:inline-block}
  .panel{padding:10px;border-radius:10px}
  .panel h3{margin-bottom:6px;font-size:10.5px}
  .ph{margin-bottom:6px}
  .plist li{padding:5px 6px;gap:8px}
  .plist .tok{--sz:26px}
  .deed-head{padding:7px 10px}
  .deed-head b{font-size:19px}
  .deed td{padding:2px 10px}
  .log{max-height:none}
  .dlg{padding:14px;gap:10px;max-height:calc(var(--h) - 16px)}
  .dlg h2{font-size:22px}
  .overlay{padding:8px max(8px,env(safe-area-inset-right,0px)) 8px max(8px,env(safe-area-inset-left,0px))}
}

/* ---------- money fx ---------- */
#fx{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.coin{position:fixed;left:0;top:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;will-change:transform;
  background:radial-gradient(circle at 35% 30%,#FFF6C2 0 16%,#F7C948 42%,#C98F12 100%);box-shadow:inset 0 0 0 2px #A8730B,0 3px 5px rgba(0,0,0,.35)}
.coin::after{content:"";position:absolute;inset:4.5px;border-radius:50%;border:1.5px solid rgba(130,82,0,.55)}
.float{position:fixed;left:0;top:0;z-index:2;white-space:nowrap;font:800 19px/1 var(--f-display);padding:.28em .55em .2em;border-radius:8px;
  box-shadow:0 4px 12px rgba(0,0,0,.28);animation:floatUp 1.25s ease-out forwards}
.float.neg{color:#fff;background:#C62828}
.float.pos{color:#fff;background:#1E8E4E}
.float.info{color:#3A2600;background:#F5C542}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}14%{opacity:1;transform:translate(-50%,-85%) scale(1.08)}72%{opacity:1}100%{opacity:0;transform:translate(-50%,-200%) scale(1)}}
.float{transform:translate(-50%,-85%)}
.plist li.hit-neg{animation:hitNeg .7s ease-out}
.plist li.hit-pos{animation:hitPos .7s ease-out}
@keyframes hitNeg{25%{background:color-mix(in srgb,#C62828 20%,transparent)}}
@keyframes hitPos{25%{background:color-mix(in srgb,#1E8E4E 20%,transparent)}}
.tok.recv{animation:recv .4s ease-out}
@keyframes recv{40%{transform:scale(1.3)}}

/* celebration */
.conf{position:fixed;top:-20px;border-radius:2px;animation:confFall 2s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes confFall{to{transform:translate(var(--dx),105vh) rotate(var(--r));opacity:.9}}
.spark{position:fixed;width:7px;height:7px;margin:-3.5px;border-radius:50%;animation:spark .8s ease-out forwards}
@keyframes spark{to{transform:translate(var(--tx),var(--ty)) scale(.2);opacity:0}}
.board.shake{animation:bshake .5s ease-in-out}
@keyframes bshake{15%{transform:translate(-6px,2px) rotate(-.4deg)}30%{transform:translate(5px,-3px) rotate(.3deg)}45%{transform:translate(-4px,1px)}60%{transform:translate(3px,2px)}80%{transform:translate(-1px,-1px)}}
.tleft{font-variant-numeric:tabular-nums}.tleft.low{color:#C62828;animation:blinkT 1s steps(2) infinite}
@keyframes blinkT{50%{opacity:.4}}
.st-h{margin:4px 0 0;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stats{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.stats li{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:7px 10px;border-radius:10px;background:var(--bg);font-size:13px}
.stats .si{grid-row:1/3;font-size:18px;text-align:center}
.stats li>span:nth-child(2){color:var(--muted);font-size:12px}
.stats b{grid-column:2;display:flex;align-items:center;gap:6px;min-width:0}
.stats b .tok{--sz:18px;border-width:1.5px}
.stats em{grid-column:3;grid-row:1/3;font-style:normal;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
/* online */
.on-sec h2 small{font:500 13px var(--f-body);color:var(--muted);margin-left:6px}
.on-sec>*{min-width:0}
.on-card{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.on-col{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:8px;align-content:start}
.on-col h3{margin:0;font:800 18px/1 var(--f-display)}
.on-col .hint{margin:0}
.on-join{display:flex;gap:8px}
.on-join input{flex:1;min-width:0;font:800 22px/1 var(--f-display);letter-spacing:.3em;text-align:center;padding:.4em;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.on-st{min-height:1.2em;font-weight:600;color:var(--ink)}
@media (max-width:600px){.on-card{grid-template-columns:minmax(0,1fr)}}
.lb-k{font:700 12px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.lb-code{display:flex;gap:8px}
.lb-code i{font:800 clamp(40px,10vw,64px)/1 var(--f-display);font-style:normal;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:.12em .3em;box-shadow:0 3px 0 var(--line)}
.lb-list{display:grid;gap:6px}
.lb-row{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.lb-row.me{border-color:var(--ink)}
.lb-row b{font-size:15px}
.lb-name{flex:1;min-width:0;font:600 15px var(--f-body);padding:.35em .5em;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.lb-row .tag.me{background:var(--ink);color:var(--bg)}
.lb-h{margin:14px 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lb-toks{display:flex;flex-wrap:wrap;gap:4px}
.lb-cols{margin-top:8px}
.lb-info{margin:0;font-size:15px}
.lobby .s-go{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.wait{margin:0;font-size:max(13px,1.6cqi);opacity:.85;animation:waitp 1.6s ease-in-out infinite}
@keyframes waitp{50%{opacity:.45}}

/* soft background music: a slow generative pentatonic loop */
const BGM=(()=>{let ac=null,out=null,timer=null,next=0,step=0;
  const CH=[[220,277.2,329.6],[196,246.9,293.7],[174.6,220,261.6],[196,246.9,329.6]];
  const MEL=[659.3,587.3,523.3,440,392,329.6,293.7];
  function note(f,t,d,vol,type='sine'){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.06);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(out);o.start(t);o.stop(t+d+.05);}
  function tick(){const beat=.5;while(next<ac.currentTime+.6){const bar=Math.floor(step/8)%4,b=step%8,ch=CH[bar];
      if(b===0){ch.forEach(f=>note(f,next,beat*8,.05,'triangle'));note(ch[0]/2,next,beat*8,.07);}
      if(b%2===0)note(ch[(b/2)%3]*2,next,beat*1.6,.035);
      if(Math.random()<.35)note(MEL[Math.floor(Math.random()*MEL.length)],next+beat/2,beat*2,.03);
      next+=beat;step++;}}
  return {
    start(){if(timer||CFG.mute||CFG.music===false)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();
      if(ac.state==='suspended')ac.resume();if(!out){out=ac.createGain();out.connect(ac.destination);}
      out.gain.cancelScheduledValues(ac.currentTime);out.gain.setValueAtTime(0,ac.currentTime);out.gain.linearRampToValueAtTime(.6,ac.currentTime+2);
      next=ac.currentTime+.1;timer=setInterval(tick,200);}catch(e){}},
    stop(){if(!timer)return;clearInterval(timer);timer=null;try{out.gain.cancelScheduledValues(ac.currentTime);out.gain.setValueAtTime(out.gain.value,ac.currentTime);out.gain.linearRampToValueAtTime(0,ac.currentTime+.4);}catch(e){}},
    sync(){(view==='game'&&!CFG.mute&&CFG.music!==false)?this.start():this.stop();}
  };})();
document.addEventListener('visibilitychange',()=>{document.hidden?BGM.stop():BGM.sync();});

const SFX=(()=>{let ac=null,master=null;
  function ctx(){if(CFG.mute)return null;try{if(!ac){ac=new (window.AudioContext||window.webkitAudioContext)();master=ac.createGain();master.gain.value=.5;master.connect(ac.destination);}
    if(ac.state==='suspended')ac.resume();}catch(e){return null;}return ac;}
  function tone(f,d,{type='sine',vol=.3,t=0,slide=0}={}){const a=ctx();if(!a)return;const t0=a.currentTime+t,o=a.createOscillator(),g=a.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t0);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,f+slide),t0+d);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.008);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    o.connect(g);g.connect(master);o.start(t0);o.stop(t0+d+.02);}
  function noise(d,{vol=.25,t=0,freq=2500,q=1}={}){const a=ctx();if(!a)return;const t0=a.currentTime+t,n=Math.floor(a.sampleRate*d),b=a.createBuffer(1,n,a.sampleRate),c=b.getChannelData(0);
    for(let i=0;i<n;i++)c[i]=(Math.random()*2-1)*(1-i/n);const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();
    s.buffer=b;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;g.gain.value=vol;s.connect(f);f.connect(g);g.connect(master);s.start(t0);}
  return {
    unlock(){ctx();},
    rattle(){noise(.05,{vol:.35,freq:1800+Math.random()*1500,q:2});tone(500+Math.random()*400,.04,{type:'triangle',vol:.08});},
    land(){noise(.08,{vol:.5,freq:900,q:1.5});noise(.07,{vol:.4,freq:1200,q:1.5,t:.09});},
    step(){tone(720,.06,{type:'triangle',vol:.14});noise(.03,{vol:.12,freq:3000,q:3});},
    coinIn(){tone(1320,.09,{type:'square',vol:.07});tone(1760,.25,{type:'square',vol:.07,t:.07});},
    coinOut(){tone(520,.12,{type:'triangle',vol:.18,slide:-200});tone(390,.18,{type:'triangle',vol:.15,t:.09,slide:-150});},
    buy(){[0,.08,.16].forEach((t,k)=>tone([784,988,1319][k],.18,{type:'square',vol:.06,t}));noise(.15,{vol:.2,freq:6000,q:.8,t:.2});tone(2093,.4,{vol:.1,t:.22});},
    card(){noise(.25,{vol:.3,freq:2500,q:.6});tone(660,.15,{vol:.12,t:.35});tone(990,.3,{vol:.12,t:.45});},
    jail(){tone(196,.35,{type:'sawtooth',vol:.12});tone(147,.5,{type:'sawtooth',vol:.12,t:.3});noise(.12,{vol:.4,freq:400,t:.75});},
    go(){[523,659,784,1047].forEach((f,k)=>tone(f,.22,{type:'triangle',vol:.16,t:k*.08}));},
    build(){noise(.06,{vol:.4,freq:700,q:2});noise(.06,{vol:.4,freq:700,q:2,t:.12});tone(880,.15,{type:'triangle',vol:.12,t:.24});},
    win(){[523,659,784,1047,784,1047].forEach((f,k)=>tone(f,.3,{type:'triangle',vol:.18,t:k*.13}));},
    click(){tone(900,.03,{type:'triangle',vol:.08});}
  };})();

function money(n){const c=SK().cur;const neg=n<0;n=Math.abs(Math.round(n));return (neg?'−':'')+c.p+n.toLocaleString('vi-VN')+c.s;}
function tname(i){const t=T[i],s=SK();
  switch(t.type){case 'prop':return s.props[t.k];case 'station':return s.stations[t.k];case 'util':return s.utils[t.k];
  case 'chance':return s.chance;case 'chest':return s.chest;case 'tax':return t.n;case 'go':return 'Xuất phát';
  case 'jail':return 'Nhà tù';case 'park':return 'Bãi đỗ xe';case 'gojail':return 'Vào tù';}return '';}
function inkOn(hex){const n=parseInt(hex.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;
  return (0.2126*r+0.7152*g+0.0722*b)>0.55?'#161616':'#FFFFFF';}

/* ================= rules ================= */
function rentOf(i,sum){const t=T[i],o=S.own[i];if(!o||o.m)return 0;
  if(t.type==='prop'){if(o.lv>0)return t.rent[o.lv];
    const full=groupTiles(t.g).every(j=>S.own[j]&&S.own[j].o===o.o);return full?t.rent[0]*2:t.rent[0];}
  if(t.type==='station'){const n=STATIONS.filter(j=>S.own[j]&&S.own[j].o===o.o).length;return 25*2**(n-1);}
  if(t.type==='util'){const n=UTILS.filter(j=>S.own[j]&&S.own[j].o===o.o).length;return (sum||7)*(n===2?10:4);}
  return 0;}
function ownsGroup(i){const t=T[i],o=S.own[i];return t.type==='prop'&&o&&groupTiles(t.g).every(j=>S.own[j]&&S.own[j].o===o.o);}
function groupHasHouses(i){const t=T[i];return t.type==='prop'&&groupTiles(t.g).some(j=>S.own[j]&&S.own[j].lv>0);}
function canBuild(i){const t=T[i],o=S.own[i];if(!o||t.type!=='prop'||o.m||o.lv>=5||S.phase==='debt')return false;
  if(S.buildG!==t.g||o.o!==S.cur)return false;
  const g=groupTiles(t.g);if(!g.every(j=>S.own[j]&&S.own[j].o===o.o&&!S.own[j].m))return false;
  if(o.lv>Math.min(...g.map(j=>S.own[j].lv)))return false;
  return S.players[o.o].money>=t.hc;}
function canSellHouse(i){const t=T[i],o=S.own[i];if(!o||t.type!=='prop'||o.lv===0)return false;
  return o.lv>=Math.max(...groupTiles(t.g).map(j=>S.own[j]?S.own[j].lv:0));}
function canMortgage(i){const o=S.own[i];return o&&!o.m&&o.lv===0&&!groupHasHouses(i);}
const unmortCost = i=>Math.ceil(T[i].price/2*1.1);
function canUnmort(i){const o=S.own[i];return o&&o.m&&S.players[o.o].money>=unmortCost(i);}
function worth(pi){let w=S.players[pi].money;for(const k in S.own){const o=S.own[k];if(o.o!==pi)continue;const t=T[k];w+=o.m?t.price/2:t.price;w+=o.lv*(t.hc||0);}return w;}

const idx = p=>S.players.indexOf(p);
const isP = x=>typeof x==='number';
const fxDur = ()=>({slow:1000,normal:720,fast:430,off:0})[CFG.speed];
const reduceMq = window.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):null;
function fxOn(){return CFG.speed!=='off'&&view==='game'&&typeof Element.prototype.animate==='function'&&!(reduceMq&&reduceMq.matches);}
function later(ms,fn){if(fxOn()&&ms>0)setTimeout(fn,ms);else fn();}

/* displayed balances count up/down instead of jumping */
const DISP={},MT={};let mtRaf=0;
const actual = k=>k==='pot'?S.pot:S.players[k].money;
const shown = k=>MT[k]?DISP[k]:actual(k);
function mspan(k,cls=''){const v=shown(k);return `<span class="${cls}${v<0?' neg':''}" data-mp="${k}">${money(v)}</span>`;}
function tweenMoney(k,from,delay,dur){if(!fxOn()){delete MT[k];return;}
  MT[k]={from,t0:performance.now()+delay,dur:Math.max(1,dur)};DISP[k]=from;if(!mtRaf)mtRaf=requestAnimationFrame(mtStep);}
function mtStep(now){mtRaf=0;let live=false;
  for(const k in MT){if(!S){delete MT[k];continue;}const m=MT[k],to=actual(k==='pot'?'pot':+k);
    const t=Math.min(1,Math.max(0,(now-m.t0)/m.dur)),v=t>=1?to:m.from+(to-m.from)*(1-Math.pow(1-t,3));
    DISP[k]=v;if(t>=1)delete MT[k];else live=true;
    document.querySelectorAll(`[data-mp="${k}"]`).forEach(el=>{el.textContent=money(v);el.classList.toggle('neg',v<0);});}
  if(live)mtRaf=requestAnimationFrame(mtStep);}

function anchorEl(x){
  if(isP(x))return document.querySelector(`#board .tok[data-p="${x}"]`)||document.querySelector(`#cpl .cpl-row[data-p="${x}"] .tok`)||document.querySelector(`#players li[data-p="${x}"] .tok`);
  if(x==='pot')return document.querySelector('#board .tile[data-i="20"]');
  if(x&&typeof x==='object')return document.querySelector(`#board .tile[data-i="${x.tile}"]`);
  return document.querySelector('#center #dice')||document.querySelector('#center');}
function centerOf(el){const r=el.getBoundingClientRect();return [r.left+r.width/2,r.top+r.height/2];}
function floatAt(x,y,text,cls,delay=0){if(!fxOn())return;
  later(delay,()=>{const f=document.createElement('div');f.className='float '+cls;f.textContent=text;f.style.left=x+'px';f.style.top=y+'px';
    $('#fx').appendChild(f);setTimeout(()=>f.remove(),1300);});}
function floatOn(el,text,cls,delay){if(el){const [x,y]=centerOf(el);floatAt(x,y,text,cls,delay);}}
function flashRow(k,cls){document.querySelectorAll(`#players li[data-p="${k}"],#cpl .cpl-row[data-p="${k}"]`).forEach(li=>{
  li.classList.remove(cls);void li.offsetWidth;li.classList.add(cls);setTimeout(()=>li.classList.remove(cls),750);});}
function fxMoney(from,to,amt){
  if(!fxOn())return Promise.resolve();
  const a=anchorEl(from),b=anchorEl(to);if(!a||!b)return Promise.resolve();
  const [x0,y0]=centerOf(a),[x1,y1]=centerOf(b),D=fxDur();
  if(isP(from)){floatAt(x0,y0-14,'−'+money(amt),'neg');flashRow(from,'hit-neg');}
  const n=Math.min(10,Math.max(3,Math.round(Math.log2(Math.max(amt,10)/10)+3)));
  const lift=Math.max(46,Math.hypot(x1-x0,y1-y0)*.38),layer=$('#fx');
  for(let c=0;c<n;c++){const el=document.createElement('div');el.className='coin';layer.appendChild(el);
    const jx=(Math.random()-.5)*18,jy=(Math.random()-.5)*14,mx=(x0+x1)/2+jx*2.5,my=Math.min(y0,y1)-lift+jy*2;
    const fr=[];for(let s=0;s<=12;s++){const t=s/12,u=1-t;
      const x=u*u*(x0+jx)+2*u*t*mx+t*t*x1,y=u*u*(y0+jy)+2*u*t*my+t*t*y1,sc=t<.5?.55+t*1.1:1.1-(t-.5)*.9;
      fr.push({transform:`translate(${x}px,${y}px) scale(${sc}) rotateY(${t*720}deg)`,opacity:s===0?0:t>.94?.15:1});}
    const an=el.animate(fr,{duration:D,delay:c*48,easing:'cubic-bezier(.45,.05,.55,.95)',fill:'both'});an.onfinish=()=>el.remove();}
  later(D*.85,()=>{if(isP(to)){floatAt(x1,y1-14,'+'+money(amt),'pos');flashRow(to,'hit-pos');}
    else if(to==='pot')floatAt(x1,y1,'+'+money(amt),'info');
    const t=isP(to)?anchorEl(to):null;if(t){t.classList.remove('recv');void t.offsetWidth;t.classList.add('recv');}});
  return wait(D+(n-1)*48);}
/* from/to: player index, null = ngân hàng, 'pot' = quỹ Bãi đỗ xe, {tile:i} = ngân hàng nhưng tiền bay về ô i */
function xfer(from,to,amt,opt={}){amt=Math.round(amt);if(!S||!(amt>0))return Promise.resolve();emit("xfer",[from,to,amt,opt]);
  const old={};[from,to].forEach(k=>{if(isP(k)||k==='pot')old[k]=shown(k);});
  if(isP(to))SFX.coinIn();else SFX.coinOut();
  if(isP(from))S.players[from].money-=amt;else if(from==='pot')S.pot-=amt;
  if(isP(to))S.players[to].money+=amt;else if(to==='pot')S.pot+=amt;
  if(opt.debt&&isP(from))S.cred=isP(to)?to:null;
  const D=fxDur();
  if(from in old)tweenMoney(from,old[from],0,D*.55);
  if(to in old)tweenMoney(to,old[to],D*.8,D*.5);
  renderPlayers();
  return fxMoney(from,to,amt);}
function pay(p,to,amt,kind){return xfer(idx(p),to!=null?to:(kind==='tax'&&S.rules.parking?'pot':null),amt,{debt:true});}
function goJail(p){emit("jail",idx(p));SFX.jail();p.pos=10;p.jail=true;p.jt=0;S.extra=false;S.dbl=0;renderDynamic();}
function settle(){const p=cp();if(S.phase==='gameover')return;
  if(p.money<0){S.debt={to:S.cred??null,after:(S.extra&&!p.jail)?'again':'end'};S.phase='debt';
    log(`${p.name} bị âm ${money(-p.money)}. Cần bán nhà hoặc cầm cố để trả nợ.`,S.cur);}
  else{S.debt=null;S.phase=(S.extra&&!p.jail)?'again':'end';}}

async function moveSteps(p,n){emit("move",[idx(p),n]);const dir=n>0?1:-1;
  const dest=tileEl((p.pos+n+400)%40);
  document.querySelectorAll('#board .tile.dest').forEach(e=>e.classList.remove('dest'));
  if(dest)dest.classList.add('dest');
  try{
  for(let k=0;k<Math.abs(n);k++){p.pos=(p.pos+dir+40)%40;
    renderDynamic();
    SFX.step();
    if(dir>0&&p.pos===0&&REPLAY)SFX.go();
    else if(dir>0&&p.pos===0){SFX.go();ST().go[idx(p)]++;log(`${p.name} đi qua Xuất phát, nhận ${money(S.rules.salary)}.`,idx(p));xfer(null,idx(p),S.rules.salary);}
    await wait(stepMs());}
  if(dest)await wait(400);
  }finally{if(dest)dest.classList.remove('dest');}}
async function moveTo(p,target){await moveSteps(p,(target-p.pos+40)%40||40);}

async function land(p,sum){const i=p.pos,t=T[i],me=S.cur;ST().lands[i]=(ST().lands[i]||0)+1;
  if(t.type==='prop'||t.type==='station'||t.type==='util'){const o=S.own[i];
    if(!o){if(p.money>=t.price){S.pending=i;S.phase='buy';log(`${p.name} đến ${tname(i)}. Ô còn trống, giá ${money(t.price)}.`,me);showBuyCard();return;}
      log(`${p.name} đến ${tname(i)} nhưng không đủ tiền mua.`,me);}
    else if(o.o===me){if(t.type==="prop"&&ownsGroup(i)){S.buildG=t.g;log(`${p.name} về ${tname(i)} của mình và được quyền xây nhà ở nhóm màu này.`,me);}else log(`${p.name} về ${tname(i)} của mình.`,me);}
    else if(o.m)log(`${tname(i)} đang cầm cố nên ${p.name} không phải trả tiền thuê.`,me);
    else{const r=rentOf(i,sum),st=ST();st.rentIn[o.o]+=r;st.rentOut[me]+=r;if(!st.bigRent||r>st.bigRent.a)st.bigRent={p:me,a:r,i};
      if(r>=200){emit("hit",i);shake();burstAt(tileEl(i));}log(`${p.name} trả ${money(r)} tiền thuê ${tname(i)} cho ${S.players[o.o].name}.`,me);renderCenter();await pay(p,o.o,r);}
  }else if(t.type==='chance'||t.type==='chest'){await drawCard(p,t.type,sum);return;}
  else if(t.type==='tax'){log(`${p.name} nộp ${t.n.toLowerCase()} ${money(t.amt)}.`,me);renderCenter();await pay(p,null,t.amt,'tax');}
  else if(t.type==='gojail'){log(`${p.name} dừng ở ô Vào tù và bị đưa thẳng vào tù.`,me);renderCenter();await wait(stepMs()*3);goJail(p);}
  else if(t.type==='park'){if(S.rules.parking&&S.pot>0){log(`${p.name} nhận toàn bộ quỹ Bãi đỗ xe: ${money(S.pot)}.`,me);renderCenter();await xfer('pot',me,S.pot);}
    else log(`${p.name} nghỉ chân ở Bãi đỗ xe.`,me);}
  else if(t.type==='jail')log(`${p.name} ghé thăm nhà tù.`,me);
  else if(t.type==='go')log(`${p.name} dừng đúng ô Xuất phát.`,me);
  settle();}

async function repairs(p,h,ho){let n=0,m=0;for(const k in S.own){const o=S.own[k];if(o.o!==S.cur)continue;if(o.lv===5)m++;else n+=o.lv;}
  const amt=n*h+m*ho;log(`${p.name} có ${n} nhà, ${m} khách sạn: nộp ${money(amt)}.`,S.cur);await pay(p,null,amt,'tax');}

async function showCardFx(deck,dn,text){emit("card",[deck,dn,text]);
  const ic=deck==='chance'?IC.q:IC.star,col=deck==='chance'?'#D9472B':'#2F7FC1';
  const fx=document.createElement('div');fx.className='cardfx';fx.style.setProperty('--cfc',col);
  fx.innerHTML=`<div class="cf-card"><div class="cf-face cf-back">${ic}</div><div class="cf-face cf-front"><span class="ci">${ic}</span><span class="ck">${esc(dn)}</span><p>${esc(text)}</p></div></div>`;
  document.body.appendChild(fx);SFX.card();
  await wait(900+Math.max(1400,readMs()));
  fx.classList.add('out');await wait(300);fx.remove();}
async function drawCard(p,deck,sum){const c=CARDS[deck][Math.floor(Math.random()*CARDS[deck].length)];
  const text=c.t();const dn=deck==='chance'?SK().chance:SK().chest;
  S.card={deck,text};log(`${p.name} rút thẻ ${dn}: ${text}`,S.cur);renderCenter();
  await showCardFx(deck,dn,text);
  const again=await c.f(p);renderPlayers();
  if(again){await land(p,sum);return;}
  settle();}

async function doRoll(){if(busy||!S||!(S.phase==='roll'||S.phase==='again'))return;buildMode=false;
  busy=true;S.card=null;S.showSum=false;S.buildG=null;renderCenter();const p=cp();
  const d=[rand6(),rand6()];await animateDice(d);S.dice=d;S.showSum=true;const sum=d[0]+d[1],dbl=d[0]===d[1];
  if(p.jail){
    if(dbl){p.jail=false;p.jt=0;S.extra=false;log(`${p.name} đổ được đôi ${d[0]}–${d[1]} và ra tù.`,S.cur);await moveSteps(p,sum);await land(p,sum);}
    else{p.jt++;
      if(p.jt>=3){await pay(p,null,50,'tax');p.jail=false;p.jt=0;S.extra=false;log(`${p.name} ở tù đủ 3 lượt, nộp ${money(50)} rồi đi ${sum} bước.`,S.cur);await moveSteps(p,sum);await land(p,sum);}
      else{S.extra=false;log(`${p.name} đổ ${d[0]}–${d[1]}, chưa được đôi. Vẫn ở tù (lần ${p.jt}/3).`,S.cur);settle();}}
  }else{

    else S.dbl=0;
    if(dbl){ST().dbl[S.cur]++;if(S.rules.dblBonus){log(`${p.name} đổ đôi, thưởng ${money(50)}!`,S.cur);xfer(null,S.cur,50);}}
    S.extra=dbl;log(`${p.name} đổ ${d[0]}–${d[1]}${dbl?' (đôi!)':''}, đi ${sum} bước.`,S.cur);
    await moveSteps(p,sum);await land(p,sum);}

async function animateDice(d){emit("dice",d);const row=$("#dice");const ms=diceMs();

function doBuy(){if(S.phase!=='buy')return;SFX.buy();if(modalKind==='buy')closeModal();const p=cp(),i=S.pending;S.own[i]={o:S.cur,lv:0,m:false};

function endTurn(){if(busy||S.phase!=='end')return;S.card=null;S.showSum=false;S.dbl=0;S.extra=false;nextPlayer();}
/* nothing left to do this turn (no building right) -> pass the turn automatically */
let autoT=0;
function autoEnd(){clearTimeout(autoT);if(!S||S.phase!=="end"||busy||buildMode||NET.mode==="guest")return;if(buildable(S.cur).length)return;
  autoT=setTimeout(()=>{if(S&&S.phase==="end"&&!busy&&!buildMode&&!buildable(S.cur).length)endTurn();else autoEnd();},1300);}
function nextPlayer(){S.buildG=null;if(timeLeft()<=0){log(`Hết giờ! Tính tổng tài sản để tìm người thắng.`,null);finishByWorth();return;}let n=S.cur;do{n=(n+1)%S.players.length;}while(S.players[n].bankrupt);
  S.cur=n;S.turnNo++;S.cred=null;buildMode=false;const p=cp();
  if(p.money<0){S.phase='debt';S.debt={to:null,after:'roll'};log(`${p.name} đang âm ${money(-p.money)}, cần xoay tiền trước khi đổ.`,n);}
  else{S.phase='roll';S.msg=p.jail?`${p.name} đang ở tù (đã chờ ${p.jt}/3 lượt). Đổ được đôi để ra tù.`:(S.online?`Đến lượt ${p.name}.`:`Đến lượt ${p.name}. Chuyền máy cho ${p.name} nhé.`);}
  renderAll();save();}
function declareBankrupt(){const me=S.cur,p=cp(),to=S.debt?S.debt.to:null;
  for(const k in S.own){const o=S.own[k];if(o.o!==me)continue;
    if(to!=null){S.players[to].money+=o.lv*(T[k].hc||0)/2;o.o=to;o.lv=0;}else delete S.own[k];}
  if(to!=null)S.players[to].money+=p.money;
  p.money=0;p.bankrupt=true;p.jail=false;p.cards=0;S.debt=null;S.card=null;
  log(`${p.name} tuyên bố phá sản.${to!=null?` Toàn bộ đất chuyển cho ${S.players[to].name}.`:' Đất trả về ngân hàng.'}`,me);
  const alive=S.players.filter(q=>!q.bankrupt);
  if(alive.length===1){SFX.win();S.phase='gameover';S.winner=S.players.indexOf(alive[0]);log(`${alive[0].name} thắng ván này!`,S.winner);renderAll();save();emit("win",0);confetti(140);showRanking('Có người thắng rồi');return;}
  S.extra=false;S.dbl=0;nextPlayer();}
function finishByWorth(){let best=-1,bw=-Infinity;S.players.forEach((p,i)=>{if(!p.bankrupt&&worth(i)>bw){bw=worth(i);best=i;}});
  SFX.win();S.phase='gameover';S.winner=best;S.card=null;log(`Ván kết thúc. ${S.players[best].name} giàu nhất với ${money(bw)}.`,best);renderAll();save();emit("win",0);confetti(140);showRanking('Kết thúc ván');}
/* stats, time limit, celebration effects */
function newStats(n){const z=()=>Array(n).fill(0);return {rentIn:z(),rentOut:z(),go:z(),dbl:z(),bought:z(),built:z(),lands:{},bigRent:null};}
function ST(){if(!S.stats)S.stats=newStats(S.players.length);return S.stats;}
function timeLeft(){return S&&S.rules.limit?S.rules.limit*60000-(Date.now()-(S.t0||Date.now())):Infinity;}
function fmtLeft(ms){ms=Math.max(0,ms);const m=Math.floor(ms/60000),s=Math.floor(ms/1000)%60;return `${m}:${String(s).padStart(2,'0')}`;}
setInterval(()=>{if(!S)return;const l=timeLeft();document.querySelectorAll('.tleft').forEach(el=>{el.textContent=fmtLeft(l);el.classList.toggle('low',l<120000);});},1000);
function confetti(n=90){if(!fxOn())return;const fx=$('#fx');const cols=['#F5C542','#E8463A','#2F9A58','#2F6FDB','#E0588F','#FF9F43'];
  for(let k=0;k<n;k++){const c=document.createElement('i');c.className='conf';const x=Math.random()*100,dx=(Math.random()-.5)*40,r=Math.random()*720-360;
    c.style.cssText=`left:${x}vw;background:${cols[k%cols.length]};--dx:${dx}vw;--r:${r}deg;animation-delay:${Math.random()*.4}s;animation-duration:${1.6+Math.random()*1.4}s;width:${6+Math.random()*6}px;height:${8+Math.random()*8}px`;
    fx.appendChild(c);setTimeout(()=>c.remove(),3600);}}
function burstAt(el,n=26){if(!fxOn()||!el)return;const [x,y]=centerOf(el);const fx=$('#fx');const cols=['#F5C542','#FFE39A','#E8463A','#fff'];
  for(let k=0;k<n;k++){const c=document.createElement('i');c.className='spark';const a=k/n*Math.PI*2,d=40+Math.random()*60;
    c.style.cssText=`left:${x}px;top:${y}px;background:${cols[k%cols.length]};--tx:${Math.cos(a)*d}px;--ty:${Math.sin(a)*d}px`;fx.appendChild(c);setTimeout(()=>c.remove(),900);}}
function shake(){if(!fxOn())return;const b=$('#board');if(!b)return;b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),600);}
function statsHTML(){if(!S.stats)return '';const st=S.stats,P=S.players,best=a=>{let m=-1,k=-1;a.forEach((v,i)=>{if(v>m){m=v;k=i;}});return m>0?k:-1;};
  const row=(ic,label,k,val)=>k<0?'':`<li><span class="si">${ic}</span><span>${label}</span><b><span class="tok" style="--pc:${P[k].color}">${tokEmoji(P[k].token)}</span>${esc(P[k].name)}</b><em>${val}</em></li>`;
  let hot=-1,hc=0;for(const k in st.lands)if(st.lands[k]>hc){hc=st.lands[k];hot=+k;}
  const r=[row('💰','Thu tiền thuê nhiều nhất',best(st.rentIn),money(Math.max(...st.rentIn))),
    row('💸','Trả tiền thuê nhiều nhất',best(st.rentOut),money(Math.max(...st.rentOut))),
    row('🏠','Xây nhiều nhà nhất',best(st.built),Math.max(...st.built)+' lần'),
    row('🎲','Đổ đôi nhiều nhất',best(st.dbl),Math.max(...st.dbl)+' lần'),
    row('🔄','Qua Xuất phát nhiều nhất',best(st.go),Math.max(...st.go)+' lần')].join('');
  const big=st.bigRent?`<li><span class="si">🔥</span><span>Cú trả thuê đau nhất</span><b>${esc(P[st.bigRent.p].name)}</b><em>${money(st.bigRent.a)} ở ${esc(tname(st.bigRent.i))}</em></li>`:'';
  const hotl=hot>=0?`<li><span class="si">📍</span><span>Ô bị dừng nhiều nhất</span><b>${esc(tname(hot))}</b><em>${hc} lần</em></li>`:'';
  const mins=S.t0?Math.round((Date.now()-S.t0)/60000):0;
  return `<h3 class="st-h">Thống kê ván · ${S.turnNo} lượt · ${mins} phút</h3><ul class="stats">${r}${big}${hotl}</ul>`;}

/* property management */
function manage(kind,i){if(busy||!S||S.phase==='gameover')return;const o=S.own[i];if(!o)return;const p=S.players[o.o],t=T[i],pi=o.o;
  if(kind==='build'&&canBuild(i)){ST().built[pi]++;o.lv++;const lv=o.lv;
    log(`${p.name} ${lv===5?'nâng khách sạn':'xây nhà thứ '+lv} ở ${tname(i)} (−${money(t.hc)}).`,pi);
    emit('build',[i,lv]);fxBuilt(i,lv);
    xfer(pi,{tile:i},t.hc);}
  else if(kind==='sellh'&&canSellHouse(i)){o.lv--;log(`${p.name} bán bớt nhà ở ${tname(i)} (+${money(t.hc/2)}).`,pi);xfer({tile:i},pi,t.hc/2);}
  else if(kind==='mort'&&canMortgage(i)){o.m=true;log(`${p.name} cầm cố ${tname(i)} (+${money(t.price/2)}).`,pi);xfer({tile:i},pi,t.price/2);}
  else if(kind==='unmort'&&canUnmort(i)){const c=unmortCost(i);o.m=false;log(`${p.name} chuộc lại ${tname(i)} (−${money(c)}).`,pi);xfer(pi,{tile:i},c);}
  else return;
  renderAll();save();}
function sellTo(i,bArg,pArg){if(busy||!S)return;const o=S.own[i];if(!o||groupHasHouses(i))return;
  const b=bArg!=null?bArg:+$('#buyer').value,price=Math.max(0,Math.round(+(pArg!=null?pArg:$('#sellprice').value)||0));const buyer=S.players[b],seller=S.players[o.o];
  if(!buyer||buyer.bankrupt||b===o.o)return;
  if(buyer.money<price){if($('#sellmsg'))$('#sellmsg').textContent=`${buyer.name} chỉ có ${money(buyer.money)}, không đủ trả ${money(price)}.`;return;}
  xfer(b,o.o,price);log(`${seller.name} bán ${tname(i)} cho ${buyer.name} với giá ${money(price)}.`,o.o);o.o=b;renderAll();save();}

/* ================= rendering ================= */
function dieHTML(v,skin=CFG.dice){if(skin==='digit')return `<span class="die digit"><b>${v}</b></span>`;
  let h='<span class="die"><svg viewBox="-3 -3 36 36" aria-label="'+v+'">';PIPS[v].forEach(j=>{h+=`<circle class="pip on" cx="${5+(j%3)*10}" cy="${5+Math.floor(j/3)*10}" r="3.3"/>`;});return h+'</svg></span>';}
function gridPos(i){if(i<=10)return[11,11-i];if(i<=20)return[11-(i-10),1];if(i<=30)return[1,1+(i-20)];return[1+(i-30),11];}
function tileHTML(i){const t=T[i],[r,c]=gridPos(i),st=`grid-row:${r};grid-column:${c}`,nm=esc(tname(i));
  if(i%10===0){const m={go:[IC.go,'Xuất phát',`Qua ô nhận ${money(S.rules.salary)}`],jail:[IC.jail,'Nhà tù','Hoặc chỉ ghé thăm'],
      park:[IC.park,'Bãi đỗ xe',S.rules.parking?'Nhận quỹ khi dừng':'Nghỉ chân miễn phí'],gojail:[IC.lock,'Vào tù','Đi thẳng vào tù']}[t.type];
    return `<div class="tile corner c-${t.type}" data-act="tile" data-i="${i}" style="${st}" tabindex="0" role="button" aria-label="${m[1]}"><span class="ticon">${m[0]}</span><span class="cl">${m[1]}</span><span class="cs">${m[2]}</span><div class="toks"></div></div>`;}
  const side=i<10?'side-b':i<20?'side-l':i<30?'side-t':'side-r';let band='',info;
  if(t.type==='prop'){band=`<div class="band" style="background:var(--g${t.g})"><span class="houses"></span></div>`;info=`<span class="tname">${nm}</span>${tileArt(CFG.skin,t.k).replace(`class="tart"`,`class="tart" style="--tc:var(--g${t.g})"`)}<span class="tprice">${money(t.price)}</span>`;}
  else{const ic={station:IC.train,util:t.k?IC.drop:IC.bolt,chance:IC.q,chest:IC.star,tax:IC.coin}[t.type];
    info=`<span class="tname">${nm}</span><span class="ticon">${ic}</span><span class="tprice">${t.price?money(t.price):t.amt?'−'+money(t.amt):''}</span>`;}
  return `<div class="tile ${side} t-${t.type}" data-act="tile" data-i="${i}" style="${st}" tabindex="0" role="button" aria-label="${nm}">${band}<div class="tinfo">${info}</div><div class="own"></div><div class="toks"></div></div>`;}

function renderTop(){const t=$('#top');
  let nav='';
  if(view==='game')nav=`<button class="btn ghost sm" data-act="mute" aria-label="Bật/tắt âm thanh">${CFG.mute?'🔇':'🔊'}</button><button class="btn ghost sm" data-act="music" aria-label="Bật/tắt nhạc nền" style="${CFG.music===false||CFG.mute?'opacity:.45':''}">🎵</button><button class="btn ghost sm" data-act="open-drawer">Tùy chỉnh</button><button class="btn ghost sm" data-act="rank">Xếp hạng</button>${S.phase!=='gameover'?'<button class="btn ghost sm" data-act="endgame">Kết thúc ván</button>':''}<button class="btn ghost sm" data-act="newgame">Ván mới</button>`;
  else if(view==='setup'&&S&&!S.online&&S.phase!=='gameover')nav=`<button class="btn ghost sm" data-act="resume">Quay lại ván đang chơi</button>`;
  t.innerHTML=`<div class="brand"><span class="dice-row" data-dice="${CFG.dice}">${dieHTML(5)}</span>Cờ Tỷ Phú</div><nav>${nav}</nav>`;
  document.body.dataset.view=view;try{BGM.sync();}catch(e){}
  const m=$('#mini');if(m&&view==='game')m.innerHTML=`<span class="mini-name">${SK().name}</span><nav>${nav.replace(/Kết thúc ván/,'Kết thúc')}<button class="btn primary sm x-sheet" data-act="close-sheet">Đóng</button></nav>`;
  if(view!=='game')closeSheet();}

function render(){if(view==='setup')renderSetup();else if(view==='lobby')renderLobby();else renderGame();renderTop();}
function renderGame(){$('#main').innerHTML=`<div class="layout" data-skin="${CFG.skin}">
  <div class="board-wrap"><div class="board" id="board">${T.map((_,i)=>tileHTML(i)).join('')}<div class="center" id="center"></div></div></div>
  <aside class="side"><div class="mini" id="mini"></div><section class="panel" id="players"></section><section class="panel" id="detail"></section>
  <section class="panel"><h3>Nhật ký ván</h3><ol class="log" id="log"></ol></section></aside></div>`;renderAll();}
function renderAll(){if(view!=='game'||!S)return;autoEnd();if(NET.mode==='host')queueSync();renderDynamic();renderCenter();renderPlayers();renderDetail();renderLog();renderTop();}
let buildMode=false;
const buildable = k=>Object.keys(S.own).map(Number).filter(i=>S.own[i].o===k&&canBuild(i));
function priceLabel(i){const t=T[i],o=S.own[i];
  if(!o||VIS.hideOwn[i])return ['tprice',money(t.price),''];
  if(o.m)return ['tprice mortl','Cầm cố',''];
  const c=S.players[o.o].color,st=`--oc:${c};--oi:${inkOn(c)}`;
  if(t.type==='util')return ['tprice rent','×'+(UTILS.filter(j=>S.own[j]&&S.own[j].o===o.o).length===2?10:4),st];
  return ['tprice rent',money(rentOf(i)),st];}
function renderDynamic(){if(!$('#board'))return;if(NET.mode==='host')queueSync();
  const bset=new Set(buildMode&&S.phase!=='gameover'?buildable(S.cur):[]);
  const order=S.players.map((p,k)=>k).sort((a,b)=>(a===S.cur)-(b===S.cur));
  document.querySelectorAll('#board .tile').forEach(el=>{const i=+el.dataset.i,t=T[i],o=VIS.hideOwn[i]?null:S.own[i];
    el.classList.toggle('mort',!!(o&&o.m));el.classList.toggle('sel',sel===i);
    el.classList.toggle('can-build',bset.has(i));el.classList.toggle('dim',buildMode&&!bset.has(i));
    let bb=el.querySelector('.bb');
    if(bset.has(i)){if(!bb){bb=document.createElement('span');bb.className='bb';el.appendChild(bb);}
      bb.textContent=(S.own[i].lv===4?'+ Khách sạn ':'+ Nhà ')+money(t.hc);}else if(bb)bb.remove();
    const own=el.querySelector('.own');if(own)own.style.background=o?S.players[o.o].color:'transparent';
    const tp=el.querySelector('.tprice');
    if(tp&&t.price){const [c,txt,st]=priceLabel(i);if(tp.className!==c)tp.className=c;if(tp.textContent!==txt)tp.textContent=txt;if(tp.getAttribute('style')!==st)tp.setAttribute('style',st);}
    const h=el.querySelector('.houses');
    if(h){const lv=o?Math.max(0,o.lv-(VIS.hideLv[i]||0)):0;
      if(h.dataset.lv!==String(lv)){const d=VIS.drop[i]&&lv>(+h.dataset.lv||0);h.dataset.lv=lv;
        if(lv===5)h.innerHTML=`<i class="hotel${d?' drop':''}"></i>`;
        else h.innerHTML=Array.from({length:lv},(_,k)=>`<i class="house${d&&k===lv-1?' drop':''}"></i>`).join('');}}
    el.querySelector('.toks').innerHTML=order.map(k=>{const p=S.players[k];return (!p.bankrupt&&p.pos===i)?`<span class="tok${k===S.cur&&S.phase!=='gameover'?' cur':''}${p.jail?' jailed':''}" data-p="${k}" style="--pc:${p.color}" title="${esc(p.name)}">${tokEmoji(p.token)}</span>`:'';}).join('');});}
function actionsHTML(){const p=cp(),dis=busy?'disabled':'';
  if(online()&&!myTurn()&&S.phase!=='gameover')return `<p class="wait">Đang chờ <b>${esc(p.name)}</b>…</p>`;
  if(buildMode&&S.phase!=='gameover')return `<button class="btn primary" data-act="buildmode">Xây xong</button>`;
  const bbtn=!busy&&['roll','again','end','debt'].includes(S.phase)&&S.phase!=='debt'&&buildable(S.cur).length?`<button class="btn" data-act="buildmode">Xây nhà</button>`:'';
  return actionsCore(p,dis)+bbtn;}
function actionsCore(p,dis){
  switch(S.phase){
    case 'roll':if(p.jail)return `<button class="btn primary" data-act="roll" ${dis}>Đổ tìm đôi</button><button class="btn" data-act="payjail" ${busy||p.money<50?'disabled':''}>Nộp ${money(50)} ra tù</button>${p.cards?`<button class="btn" data-act="usecard" ${dis}>Dùng thẻ ra tù (${p.cards})</button>`:''}`;
      return `<button class="btn primary" data-act="roll" ${dis}>Đổ xúc xắc</button>`;
    case 'again':return `<button class="btn primary" data-act="roll" ${dis}>Được đôi, đổ tiếp</button>`;
    case 'buy':return modalKind==='buy'?'':`<button class="btn primary" data-act="showbuy">Xem sổ đỏ</button>`;
    case 'end':return buildable(S.cur).length?`<button class="btn primary" data-act="end" ${dis}>Kết thúc lượt</button>`:`<button class="btn" data-act="end" ${dis}>Chuyển lượt…</button>`;
    case 'debt':return `<button class="btn primary" data-act="paydebt" ${p.money<0?'disabled':''}>Đã đủ tiền, tiếp tục</button><button class="btn danger" data-act="askbankrupt">Phá sản</button>`;
    case 'gameover':return `<button class="btn primary" data-act="newgame">Ván mới</button><button class="btn" data-act="rank">Bảng xếp hạng</button>`;}
  return '';}

      rows=`<tr class="${n===1&&!o.m?'hl':''}"><td>Sở hữu 1 ô tiện ích</td><td>4 × số xúc xắc</td></tr><tr class="${n===2&&!o.m?'hl':''}"><td>Sở hữu cả 2 ô</td><td>10 × số xúc xắc</td></tr>`;}
    html+=`<div class="deed"><div class="deed-head" style="background:${hc};color:${inkOn(hc)}"><span>Giấy chứng nhận</span><b>${nm}</b></div>
